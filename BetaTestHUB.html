<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetaHUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%2300ff66' font-family='monospace' font-weight='bold'>B</text></svg>">

<style>
  /* ---- Page background: black, like a terminal ---- */
  body {
    background-color: #000000;
    color: #00ff66;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 60px 20px;
  }

  /* ---- Big glowing heading ---- */
  h1 {
    font-size: 44px;
    color: #00ff66;
    text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
    letter-spacing: 4px;
    margin-bottom: 40px;
  }

  /* ---- Grid that holds all 10 buttons ---- */
  .button-grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 60px 50px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ---- One button plus its caption stacked vertically ---- */
  .button-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 200px;
  }

  /* ---- Text under each button ---- */
  .button-caption {
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 0 5px #00ff66;
  }

  /* ---- The neon green button ---- */
  .neon-button {
    display: inline-block;
    min-width: 140px;
    padding: 18px 36px;
    background-color: #000000;
    color: #00ff66;
    border: 2px solid #00ff66;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-size: 18px;
    text-decoration: none;
    text-shadow: 0 0 5px #00ff66;
    box-shadow: 0 0 10px #00ff66;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
  }

  /* ---- Glow gets brighter when you hover over the button ---- */
  .neon-button:hover {
    background-color: #00ff66;
    color: #000000;
    text-shadow: none;
    box-shadow: 0 0 25px #00ff66;
  }

  /* ---- The hub stays hidden until the correct code is entered ---- */
  #hub {
    display: none;
  }

  /* ---- Access code prompt ---- */
  #gate {
    max-width: 480px;
    margin: 80px auto 0 auto;
    padding: 40px 30px;
    border: 2px solid #00ff66;
    border-radius: 8px;
    box-shadow: 0 0 20px #00ff66;
    background-color: rgba(0, 0, 0, 0.85);
  }

  #gate h2 {
    margin: 0 0 20px 0;
    font-size: 26px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00ff66;
  }

  #gate p {
    font-size: 16px;
    line-height: 1.6;
    text-shadow: 0 0 5px #00ff66;
  }

  #gate input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 10px 0 20px 0;
    background-color: #000000;
    color: #00ff66;
    border: 2px solid #00ff66;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-size: 18px;
    text-align: center;
    outline: none;
    box-shadow: 0 0 10px #00ff66;
  }

  #gate input:focus {
    box-shadow: 0 0 20px #00ff66;
  }

  #gate button.neon-button {
    min-width: 0;
    padding: 14px 30px;
  }

  /* ---- Fullscreen canvas that floats behind everything ---- */
  #particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }
</style>
</head>

<body>

  <canvas id="particles"></canvas>

  <!-- Access code prompt: shown first -->
  <div id="gate">
    <h2>BETA ACCESS</h2>

    <div id="gateForm">
      <p>Enter the beta testing code to continue.</p>
      <input type="text" id="gateInput" placeholder="Beta testing code" autocomplete="off" spellcheck="false">
      <button type="button" id="gateSubmit" class="neon-button">Enter</button>
    </div>

    <div id="gateDenied" style="display:none;">
      <p>Incorrect code.<br>Please contact Nijumet for the beta testing key.</p>
      <button type="button" id="gateRetry" class="neon-button">Try Again</button>
    </div>
  </div>

  <!-- The real page: hidden until unlocked -->
  <div id="hub">

  <h1>BetaHUB</h1>

  <!-- Button 1 is the Back button. Buttons 2-10 are generated from the BETAS list in the script below. -->
  <div class="button-grid" id="buttons">
    <div class="button-item">
      <a class="neon-button" href="index.html">Back</a>
      <div class="button-caption">Return to the main page</div>
    </div>
  </div>

  </div><!-- end #hub -->

  <script>
    // =====================================================
    // ACCESS CODE GATE
    // =====================================================
    const ACCESS_CODE = "Nijumet.Gave.Me.Access";

    const gate = document.getElementById("gate");
    const hub = document.getElementById("hub");
    const gateForm = document.getElementById("gateForm");
    const gateInput = document.getElementById("gateInput");
    const gateDenied = document.getElementById("gateDenied");

    // ---- Show the real page and hide the prompt ----
    function unlock() {
      gate.style.display = "none";
      hub.style.display = "block";
    }

    // ---- Remember access for this tab so Back/refresh doesn't ask again ----
    let alreadyUnlocked = false;
    try {
      alreadyUnlocked = sessionStorage.getItem("betaUnlocked") === "yes";
    } catch (e) {}

    if (alreadyUnlocked) {
      unlock();
    } else {
      gateInput.focus();
    }

    // ---- Check the code (runs from the Enter button or the Enter key) ----
    function checkCode() {
      if (gateInput.value.trim() === ACCESS_CODE) {
        try { sessionStorage.setItem("betaUnlocked", "yes"); } catch (err) {}
        unlock();
      } else {
        gateForm.style.display = "none";
        gateDenied.style.display = "block";
      }
    }

    document.getElementById("gateSubmit").addEventListener("click", checkCode);
    gateInput.addEventListener("keydown", e => {
      if (e.key === "Enter") checkCode();
    });

    document.getElementById("gateRetry").addEventListener("click", () => {
      gateInput.value = "";
      gateDenied.style.display = "none";
      gateForm.style.display = "block";
      gateInput.focus();
    });

    // =====================================================
    // DATA LINK SUPPORT
    // Browsers block clicking straight to a data: link, so we
    // decode it, wrap it in a Blob, and open that instead.
    // =====================================================
    function openLink(url) {
      url = url.trim();

      // Not a data link? Just go there normally.
      if (!/^data:/i.test(url)) {
        window.location.href = url;
        return;
      }

      try {
        const comma = url.indexOf(",");
        if (comma === -1) throw new Error("Invalid data link (no comma found)");

        const meta = url.slice(5, comma).split(";").map(s => s.trim()).filter(Boolean);
        const payload = url.slice(comma + 1);
        const isBase64 = meta.some(s => s.toLowerCase() === "base64");

        // Work out the content type, defaulting to UTF-8 text
        let type = meta.filter(s => s.toLowerCase() !== "base64").join(";") || "text/plain";
        if (/^text\//i.test(type) && !/charset=/i.test(type)) type += ";charset=utf-8";

        // Turn the payload into raw bytes
        let bytes;
        if (isBase64) {
          let b64 = payload.replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/");
          while (b64.length % 4) b64 += "=";
          const bin = atob(b64);
          bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        } else {
          bytes = new TextEncoder().encode(decodeURIComponent(payload));
        }

        const blobUrl = URL.createObjectURL(new Blob([bytes], { type: type }));
        window.location.href = blobUrl;
      } catch (err) {
        alert("Could not open this link: " + err.message);
      }
    }

    // ---- Build buttons 2-10 ----
    const buttonBox = document.getElementById("buttons");
    BETAS.forEach(item => {
      const wrap = document.createElement("div");
      wrap.className = "button-item";

      const a = document.createElement("a");
      a.className = "neon-button";
      a.href = "#";
      a.textContent = item.label;
      a.addEventListener("click", e => {
        e.preventDefault();
        openLink(item.url);
      });

      const caption = document.createElement("div");
      caption.className = "button-caption";
      caption.textContent = item.desc;

      wrap.appendChild(a);
      wrap.appendChild(caption);
      buttonBox.appendChild(wrap);
    });

    // =====================================================
    // PARTICLE EFFECT (floating green dots in the background)
    // =====================================================
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const PARTICLE_COUNT = 120;
    const particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedY: Math.random() * 0.5 + 0.1,
        drift: Math.random() * 0.4 - 0.2,
        alpha: Math.random() * 0.5 + 0.3
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.drift;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 255, 102, ${p.alpha})`;
        ctx.shadowColor = "#00ff66";
        ctx.shadowBlur = 8;
        ctx.fill();
      });

      requestAnimationFrame(drawParticles);
    }

    drawParticles();
  </script>
