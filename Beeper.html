<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beeper</title>
  <style>
    :root {
      --neon: #39ff88;
      --neon-soft: rgba(57, 255, 136, 0.35);
      --neon-faint: rgba(57, 255, 136, 0.12);
      --text: #c9f7dc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 16px;
      font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 40%, #0f2a1c 0%, #07120c 55%, #030806 100%);
    }

    /* faint scanline texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 3px;
      color: #eafff3;
      text-shadow: 0 0 8px var(--neon), 0 0 22px rgba(57, 255, 136, 0.55), 0 0 44px rgba(57, 255, 136, 0.25);
    }

    .controls {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 390px;
      padding: 20px;
      border: 1.5px solid var(--neon);
      border-radius: 12px;
      background: rgba(2, 10, 6, 0.75);
      box-shadow:
        0 0 8px var(--neon-soft),
        0 0 24px rgba(57, 255, 136, 0.22),
        inset 0 0 22px var(--neon-faint);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1 1 auto;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: var(--neon);
      background: rgba(57, 255, 136, 0.06);
      border: 1.5px solid var(--neon);
      border-radius: 8px;
      text-shadow: 0 0 6px rgba(57, 255, 136, 0.7);
      box-shadow: 0 0 6px var(--neon-soft), inset 0 0 8px var(--neon-faint);
      transition: background 0.15s, box-shadow 0.15s, color 0.15s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:hover {
      background: rgba(57, 255, 136, 0.14);
      box-shadow: 0 0 14px rgba(57, 255, 136, 0.6), inset 0 0 10px rgba(57, 255, 136, 0.2);
    }

    button:active,
    button.active {
      color: #03140a;
      background: var(--neon);
      text-shadow: none;
      box-shadow: 0 0 18px rgba(57, 255, 136, 0.85), 0 0 36px rgba(57, 255, 136, 0.4);
    }

    button:active { transform: translateY(1px); }

    button:focus-visible,
    select:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid #b6ffd0;
      outline-offset: 3px;
    }

    label {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "name value"
        "ctrl ctrl";
      row-gap: 8px;
      align-items: center;
      font-size: 14px;
    }

    label > span:first-child { grid-area: name; }

    .readout {
      grid-area: value;
      font-variant-numeric: tabular-nums;
      color: #eafff3;
      text-shadow: 0 0 6px rgba(57, 255, 136, 0.8);
    }

    label > input,
    label > select { grid-area: ctrl; }

    /* Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      --pct: 50%;
      background: linear-gradient(to right, var(--neon) 0%, var(--neon) var(--pct), #14301f var(--pct), #14301f 100%);
      box-shadow: 0 0 8px rgba(57, 255, 136, 0.3);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #8dffbd 55%, var(--neon));
      border: none;
      box-shadow: 0 0 10px var(--neon), 0 0 20px rgba(57, 255, 136, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #8dffbd 55%, var(--neon));
      border: none;
      box-shadow: 0 0 10px var(--neon), 0 0 20px rgba(57, 255, 136, 0.5);
    }

    input[type="range"]::-moz-range-track {
      background: transparent;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      font: inherit;
      color: var(--text);
      background: #06150d;
      border: 1.5px solid var(--neon);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 6px var(--neon-soft), inset 0 0 8px var(--neon-faint);
    }

    canvas {
      display: block;
      max-width: 100%;
      background: #050d08;
      border: 1.5px solid var(--neon);
      border-radius: 10px;
      box-shadow:
        0 0 8px var(--neon-soft),
        0 0 24px rgba(57, 255, 136, 0.22),
        0 0 56px rgba(57, 255, 136, 0.1),
        inset 0 0 22px var(--neon-faint);
    }
  </style>
</head>
<body>
  <h1>Beeper</h1>

  <div class="controls">
    <div class="btn-row">
      <button id="pulseBtn">Pulse</button>
      <button id="toggleBtn">Start</button>
      <button id="holdBtn">Hold to Beep</button>
    </div>

    <label>
      <span>Pulse Length (ms)</span>
      <span class="readout" id="pulseLengthVal"></span>
      <input id="pulseLength" type="range" min="50" max="2000" value="500">
    </label>

    <label>
      <span>Pitch (Hz)</span>
      <span class="readout" id="pitchVal"></span>
      <input id="pitchSlider" type="range" min="100" max="2000" value="440">
    </label>

    <label>
      <span>Volume</span>
      <span class="readout" id="volumeVal"></span>
      <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.3">
    </label>

    <label>
      <span>Waveform</span>
      <select id="waveform">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
      </select>
    </label>
  </div>

  <canvas id="visualizer"></canvas>

  <script>
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let analyser = null;
    let isToggling = false;

    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    // Crisp canvas on high-DPI screens (logical size stays 500x150)
    const VIEW_W = 500;
    const VIEW_H = 150;
    const DPR = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = VIEW_W * DPR;
    canvas.height = VIEW_H * DPR;
    canvas.style.width = VIEW_W + "px";
    canvas.style.height = VIEW_H + "px";
    ctx.scale(DPR, DPR);

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
      }
    }

    function createOscillator() {
      initAudio();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.frequency.value = parseFloat(pitchSlider.value);
      osc.type = waveform.value;
      gainNode.gain.value = parseFloat(volumeSlider.value);

      osc.connect(gainNode);
      gainNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function startContinuousBeep() {
      if (osc) return;
      createOscillator();
      osc.start();
    }

    function stopContinuousBeep() {
      if (!osc) return;
      osc.stop();
      osc.disconnect();
      gainNode.disconnect();
      osc = null;
      gainNode = null;
    }

    // Pulse button
    pulseBtn.addEventListener("click", () => {
      initAudio();
      const localOsc = audioCtx.createOscillator();
      const localGain = audioCtx.createGain();

      localOsc.frequency.value = parseFloat(pitchSlider.value);
      localOsc.type = waveform.value;
      localGain.gain.value = parseFloat(volumeSlider.value);

      localOsc.connect(localGain);
      localGain.connect(analyser);
      analyser.connect(audioCtx.destination);

      localOsc.start();

      const duration = parseInt(pulseLength.value);

      // light the button for the length of the pulse
      pulseBtn.classList.add("active");

      setTimeout(() => {
        localOsc.stop();
        localOsc.disconnect();
        localGain.disconnect();
        pulseBtn.classList.remove("active");
      }, duration);
    });

    // Toggle continuous beep
    toggleBtn.addEventListener("click", (e) => {
      isToggling = !isToggling;
      if (isToggling) {
        startContinuousBeep();
        e.target.textContent = "Pause";
        e.target.classList.add("active");
      } else {
        stopContinuousBeep();
        e.target.textContent = "Start";
        e.target.classList.remove("active");
      }
    });

    // Hold-to-beep
    let isHolding = false;

    holdBtn.addEventListener("mousedown", () => {
      if (osc) return; // already beeping (Start is on), leave it alone
      isHolding = true;
      startContinuousBeep();
      holdBtn.classList.add("active");
    });

    document.addEventListener("mouseup", () => {
      if (!isHolding) return; // only the hold button's own beep is stopped here
      isHolding = false;
      holdBtn.classList.remove("active");
      if (!isToggling) stopContinuousBeep();
    });

    // Live pitch + volume updates
    pitchSlider.addEventListener("input", () => {
      if (osc) osc.frequency.value = parseFloat(pitchSlider.value);
    });

    volumeSlider.addEventListener("input", () => {
      if (gainNode) gainNode.gain.value = parseFloat(volumeSlider.value);
    });

    waveform.addEventListener("change", () => {
      if (osc) osc.type = waveform.value;
    });

    // Slider readouts + filled track
    function syncSlider(slider, readout, format) {
      const min = parseFloat(slider.min);
      const max = parseFloat(slider.max);
      const val = parseFloat(slider.value);
      slider.style.setProperty("--pct", ((val - min) / (max - min) * 100) + "%");
      readout.textContent = format(val);
    }

    const sliderDefs = [
      [pulseLength, pulseLengthVal, v => Math.round(v) + " ms"],
      [pitchSlider, pitchVal, v => Math.round(v) + " Hz"],
      [volumeSlider, volumeVal, v => Math.round(v * 100) + "%"]
    ];

    sliderDefs.forEach(([slider, readout, fmt]) => {
      slider.addEventListener("input", () => syncSlider(slider, readout, fmt));
      syncSlider(slider, readout, fmt);
    });

    // Visualizer loop
    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = "rgba(57, 255, 136, 0.07)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= VIEW_W; x += 25) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, VIEW_H);
      }
      for (let y = 0; y <= VIEW_H; y += 25) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(VIEW_W, y + 0.5);
      }
      ctx.stroke();

      // center line
      ctx.strokeStyle = "rgba(57, 255, 136, 0.18)";
      ctx.beginPath();
      ctx.moveTo(0, VIEW_H / 2 + 0.5);
      ctx.lineTo(VIEW_W, VIEW_H / 2 + 0.5);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      requestAnimationFrame(draw);

      // background
      const bg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 10, VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.6);
      bg.addColorStop(0, "#08180f");
      bg.addColorStop(1, "#020604");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);

      drawGrid();

      if (!analyser) return;

      const buffer = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(buffer);

      const slice = VIEW_W / buffer.length;

      ctx.save();
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#39ff88";
      ctx.shadowColor = "#39ff88";
      ctx.shadowBlur = 12;
      ctx.beginPath();

      for (let i = 0; i < buffer.length; i++) {
        const v = buffer[i] / 128.0;
        const y = (v * VIEW_H) / 2;

        if (i === 0) ctx.moveTo(0, y);
        else ctx.lineTo(i * slice, y);
      }

      ctx.stroke();
      ctx.restore();
    }

    draw();
  </script>
</body>
</html>
