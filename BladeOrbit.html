<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Orbit | Neon Arena Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-neon: #00ffff;
            --p2-neon: #ff00ff;
            --bg-dark: #050509;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 1000px;
            height: 700px;
            max-width: 95vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: radial-gradient(circle at center, #11111d 0%, #050509 100%);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.05);
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            z-index: 10;
        }
        .neon-text-p1 {
            color: var(--p1-neon);
            text-shadow: 0 0 10px var(--p1-neon), 0 0 20px var(--p1-neon);
        }
        .neon-text-p2 {
            color: var(--p2-neon);
            text-shadow: 0 0 10px var(--p2-neon), 0 0 20px var(--p2-neon);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            border-radius: 12px;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="text-center mb-6">
        <h1 class="text-5xl font-black tracking-tighter italic text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-1">
            BLADE ORBIT
        </h1>
        <p class="text-xs uppercase tracking-[0.3em] text-gray-500 font-bold">Orbital Combat Simulation v1.0</p>
    </div>

    <!-- Main Game Wrapper -->
    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        
        <div class="ui-overlay">
            <!-- Top HUD -->
            <div class="flex justify-between items-start w-full">
                <div class="glass-panel text-left">
                    <div class="text-xs font-bold text-cyan-300 uppercase tracking-widest mb-1">Player 01</div>
                    <div id="p1-score" class="text-4xl font-black neon-text-p1 leading-none">0</div>
                    <div class="mt-2 text-[10px] text-cyan-500/50 font-bold uppercase tracking-tighter">[W A S D]</div>
                </div>

                <div class="glass-panel text-right">
                    <div class="text-xs font-bold text-fuchsia-300 uppercase tracking-widest mb-1">Player 02</div>
                    <div id="p2-score" class="text-4xl font-black neon-text-p2 leading-none">0</div>
                    <div class="mt-2 text-[10px] text-fuchsia-500/50 font-bold uppercase tracking-tighter">[ARROWS]</div>
                </div>
            </div>

            <!-- Bottom Context/Status (Dynamic via JS) -->
            <div class="flex flex-col items-center justify-center mb-8">
                <div id="game-message" class="text-4xl font-black italic tracking-tight text-white drop-shadow-2xl"></div>
                <div id="sub-message" class="text-sm font-bold uppercase tracking-widest text-white/50 mt-2"></div>
            </div>
        </div>
    </div>

    <!-- Instructions / Footer-ish area -->
    <div class="mt-8 flex gap-8 opacity-40 hover:opacity-100 transition-opacity duration-500">
        <div class="flex items-center gap-3">
            <span class="px-2 py-1 rounded bg-white/10 text-[10px] font-bold">ESC</span>
            <span class="text-xs font-medium">RESET ROUND</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="px-2 py-1 rounded bg-white/10 text-[10px] font-bold">ENTER</span>
            <span class="text-xs font-medium">RESTART MATCH</span>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const score1El = document.getElementById('p1-score');
    const score2El = document.getElementById('p2-score');
    const msgEl = document.getElementById('game-message');
    const subEl = document.getElementById('sub-message');

    const CONFIG = {
        winScore: 5,
        coreRadius: 18,
        bladeLength: 90,
        bladeSpeed: 0.08,
        moveAccel: 0.8,
        maxSpeed: 7.5,
        friction: 0.92,
        sparkCooldown: 6,
        resetDelay: 120,
        colors: {
            p1: '#00ffff',
            p1Glow: 'rgba(0, 255, 255, 0.5)',
            p2: '#ff00ff',
            p2Glow: 'rgba(255, 0, 255, 0.5)',
            bg: '#050509',
            text: '#ffffff'
        }
    };

    let gameState = 'PLAYING'; // PLAYING, SCORED, GAMEOVER
    let stateTimer = 0;
    let keys = {};
    let particles = [];
    let pulses = [];

    class Player {
        constructor(id, x, y, color, angleDir) {
            this.id = id;
            this.startX = x;
            this.startY = y;
            this.reset();
            this.color = color;
            this.angleDir = angleDir;
            this.score = 0;
            this.clashCooldown = 0;
        }

        reset() {
            this.x = this.startX;
            this.y = this.startY;
            this.vx = 0;
            this.vy = 0;
            this.angle = this.id === 1 ? 0 : Math.PI;
        }

        update() {
            if (gameState !== 'PLAYING') return;

            // Movement logic
            let ax = 0, ay = 0;
            if (this.id === 1) {
                if (keys['w'] || keys['W']) ay -= CONFIG.moveAccel;
                if (keys['s'] || keys['S']) ay += CONFIG.moveAccel;
                if (keys['a'] || keys['A']) ax -= CONFIG.moveAccel;
                if (keys['d'] || keys['D']) ax += CONFIG.moveAccel;
            } else {
                if (keys['ArrowUp']) ay -= CONFIG.moveAccel;
                if (keys['ArrowDown']) ay += CONFIG.moveAccel;
                if (keys['ArrowLeft']) ax -= CONFIG.moveAccel;
                if (keys['ArrowRight']) ax += CONFIG.moveAccel;
            }

            this.vx += ax;
            this.vy += ay;
            this.vx *= CONFIG.friction;
            this.vy *= CONFIG.friction;

            // Speed Cap
            const speed = Math.hypot(this.vx, this.vy);
            if (speed > CONFIG.maxSpeed) {
                this.vx = (this.vx / speed) * CONFIG.maxSpeed;
                this.vy = (this.vy / speed) * CONFIG.maxSpeed;
            }

            this.x += this.vx;
            this.y += this.vy;

            // Arena Bounds
            if (this.x < CONFIG.coreRadius) { this.x = CONFIG.coreRadius; this.vx *= -0.5; }
            if (this.x > canvas.width - CONFIG.coreRadius) { this.x = canvas.width - CONFIG.coreRadius; this.vx *= -0.5; }
            if (this.y < CONFIG.coreRadius) { this.y = CONFIG.coreRadius; this.vy *= -0.5; }
            if (this.y > canvas.height - CONFIG.coreRadius) { this.y = canvas.height - CONFIG.coreRadius; this.vy *= -0.5; }

            // Blade Rotation
            this.angle += CONFIG.bladeSpeed * this.angleDir;
            
            if (this.clashCooldown > 0) this.clashCooldown--;
        }

        getBladePoints() {
            return {
                x1: this.x,
                y1: this.y,
                x2: this.x + Math.cos(this.angle) * CONFIG.bladeLength,
                y2: this.y + Math.sin(this.angle) * CONFIG.bladeLength
            };
        }

        draw() {
            const blade = this.getBladePoints();
            
            // Draw Blade
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(blade.x1, blade.y1);
            ctx.lineTo(blade.x2, blade.y2);
            ctx.stroke();
            ctx.restore();

            // Draw Core
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, CONFIG.coreRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Core detail
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    }

    const p1 = new Player(1, 200, 350, CONFIG.colors.p1, 1);
    const p2 = new Player(2, 800, 350, CONFIG.colors.p2, -1);

    // Collision Detection Helpers
    function lineCircleCollide(x1, y1, x2, y2, cx, cy, r) {
        const dlx = x2 - x1;
        const dly = y2 - y1;
        const t = ((cx - x1) * dlx + (cy - y1) * dly) / (dlx * dlx + dly * dly);
        const closestX = x1 + Math.max(0, Math.min(1, t)) * dlx;
        const closestY = y1 + Math.max(0, Math.min(1, t)) * dly;
        const dist = Math.hypot(cx - closestX, cy - closestY);
        return dist < r;
    }

    function lineLineCollide(x1, y1, x2, y2, x3, y3, x4, y4) {
        const det = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3);
        if (det === 0) return null;
        const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / det;
        const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / det;
        if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
            return { x: x1 + ua * (x2 - x1), y: y1 + ua * (y2 - y1) };
        }
        return null;
    }

    // Particle Effects
    function createSparks(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                decay: 0.02 + Math.random() * 0.03,
                color
            });
        }
    }

    function createExplosion(x, y, color) {
        pulses.push({ x, y, radius: 10, maxRadius: 150, life: 1.0, color });
        for (let i = 0; i < 30; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                life: 1.5,
                decay: 0.01 + Math.random() * 0.02,
                color
            });
        }
    }

    function updateParticles() {
        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            return p.life > 0;
        });
        pulses = pulses.filter(p => {
            p.radius += 5;
            p.life -= 0.02;
            return p.life > 0;
        });
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
        pulses.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
        });
        ctx.globalAlpha = 1.0;
    }

    // Game Logic
    function handleScoring(winnerId) {
        if (gameState !== 'PLAYING') return;
        
        if (winnerId === 1) {
            p1.score++;
            msgEl.textContent = "PLAYER 1 SCORED!";
            msgEl.className = "text-4xl font-black italic tracking-tight neon-text-p1";
            createExplosion(p2.x, p2.y, CONFIG.colors.p1);
        } else {
            p2.score++;
            msgEl.textContent = "PLAYER 2 SCORED!";
            msgEl.className = "text-4xl font-black italic tracking-tight neon-text-p2";
            createExplosion(p1.x, p1.y, CONFIG.colors.p2);
        }

        score1El.textContent = p1.score;
        score2El.textContent = p2.score;

        if (p1.score >= CONFIG.winScore || p2.score >= CONFIG.winScore) {
            gameState = 'GAMEOVER';
            const ultimateWinner = p1.score >= CONFIG.winScore ? "PLAYER 1" : "PLAYER 2";
            msgEl.textContent = `${ultimateWinner} WINS THE MATCH!`;
            subEl.textContent = "PRESS ENTER TO RESTART";
            subEl.classList.add('animate-pulse-glow');
        } else {
            gameState = 'SCORED';
            stateTimer = CONFIG.resetDelay;
        }
    }

    function update() {
        p1.update();
        p2.update();
        updateParticles();

        if (gameState === 'PLAYING') {
            const b1 = p1.getBladePoints();
            const b2 = p2.getBladePoints();

            // Blade-Core Collisions
            const p1HitsP2 = lineCircleCollide(b1.x1, b1.y1, b1.x2, b1.y2, p2.x, p2.y, CONFIG.coreRadius);
            const p2HitsP1 = lineCircleCollide(b2.x1, b2.y1, b2.x2, b2.y2, p1.x, p1.y, CONFIG.coreRadius);

            if (p1HitsP2 && p2HitsP1) {
                // Draw scenario? In Blade Orbit, we treat it as simultaneous but usually one happens first.
                // For logic, let's just reset without scoring or give both points?
                // Let's give both points.
                handleScoring(1);
                handleScoring(2);
            } else if (p1HitsP2) {
                handleScoring(1);
            } else if (p2HitsP1) {
                handleScoring(2);
            }

            // Blade-Blade Collisions
            if (p1.clashCooldown === 0 && p2.clashCooldown === 0) {
                const intersect = lineLineCollide(b1.x1, b1.y1, b1.x2, b1.y2, b2.x1, b2.y1, b2.x2, b2.y2);
                if (intersect) {
                    createSparks(intersect.x, intersect.y, '#ffffff');
                    p1.clashCooldown = CONFIG.sparkCooldown;
                    p2.clashCooldown = CONFIG.sparkCooldown;
                }
            }
        } else if (gameState === 'SCORED') {
            stateTimer--;
            if (stateTimer <= 0) {
                p1.reset();
                p2.reset();
                gameState = 'PLAYING';
                msgEl.textContent = "";
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Subtle Grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for(let i=0; i<canvas.height; i+=50) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        drawParticles();
        p1.draw();
        p2.draw();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Input Listeners
    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        
        if (e.key === 'Enter' && gameState === 'GAMEOVER') {
            p1.score = 0;
            p2.score = 0;
            score1El.textContent = "0";
            score2El.textContent = "0";
            p1.reset();
            p2.reset();
            msgEl.textContent = "";
            subEl.textContent = "";
            subEl.classList.remove('animate-pulse-glow');
            gameState = 'PLAYING';
        }

        if (e.key === 'Escape') {
            p1.reset();
            p2.reset();
            gameState = 'PLAYING';
            msgEl.textContent = "";
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.key] = false;
    });

    // Start
    gameLoop();
</script>
</body>
</html>
