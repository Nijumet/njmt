<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Falling</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      color: black;
      height: 100%;
      overflow-y: scroll;
      font-family: monospace;
    }

    #wrapper {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    #column {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 32px;
      line-height: 1.2;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="column">F</div>
  </div>

  <script>
    const column = document.getElementById('column');

    function addMore(count = 2000) {
      let chunk = '';
      for (let i = 0; i < count; i++) chunk += 'A';
      column.textContent += chunk;
    }

    // Keep adding content on a timer so the page is always ahead of the scroll
    setInterval(() => addMore(2000), 300);

    // Also add more when scrolling near the bottom
    window.addEventListener('scroll', () => {
      const bottom = window.innerHeight + window.scrollY;
      const height = document.documentElement.scrollHeight;

      if (bottom > height - 1500) {
        addMore(3000);
      }
    });

    // Initial fill
    addMore(5000);
  </script>
</body>
</html>
