<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Automation</title>
<style>
:root{--bg:#e6edf1;--panel:#fbfcfd;--ink:#1d2b3a;--mute:#6b7b8c;--line:#cfd9e0;--acc:#1f8a87;--acc2:#16706e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 10px 0 0;letter-spacing:.2px}
button,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary{background:var(--acc);border-color:var(--acc2);color:#fff;font-weight:600;min-width:84px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.grp{display:flex;gap:4px}
main{display:flex;flex-wrap:wrap;gap:14px;padding:14px;align-items:flex-start;justify-content:center}
.stage{flex:1 1 560px;max-width:880px;min-width:0}
canvas{width:100%;height:auto;display:block;background:#f6f9fb;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair}
aside{flex:0 0 280px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:16px;margin:0 0 4px}
.hint{color:var(--mute);margin:0}
.obj{margin-top:9px}
.obj .t{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:#e3eaef;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.obj.ok .bar i{background:#3aa655}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#palette button{text-align:left;display:flex;gap:7px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.keys{font-size:13px;color:var(--mute);margin:8px 0 0}
#win{display:none;border-color:#3aa655;background:#effaf1}
#win.show{display:block}
</style>
</head>
<body>
<header>
  <h1>Little Automation</h1>
  <select id="lvl" aria-label="Level"></select>
  <button id="play" class="primary">Play</button>
  <button id="reset">Reset</button>
  <div class="grp" id="speeds">
    <button data-s="1">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
  </div>
  <span class="sp"></span>
  <button id="clear">Clear layout</button>
</header>
<main>
  <div class="stage"><canvas id="cv"></canvas></div>
  <aside>
    <div class="card">
      <h2 id="ltitle"></h2>
      <p class="hint" id="lhint"></p>
      <div id="objs"></div>
    </div>
    <div class="card" id="win">
      <h2>Level complete</h2>
      <p class="hint" id="wintext"></p>
      <button id="next" class="primary" style="margin-top:8px">Next level</button>
    </div>
    <div class="card" id="reccard">
      <h2>Recipes</h2>
      <p class="hint" id="rec"></p>
    </div>
    <div class="card">
      <h2>Build</h2>
      <div id="palette"></div>
      <p class="keys">W A S D set direction (up, left, down, right), even on a machine you hover. Drag to lay conveyors. Right-click erases. Space plays or pauses. Esc cancels a held machine. C sets a sorter's filter. A dark dot marks a fixed machine.</p>
    </div>
  </aside>
</main>

<script>
'use strict';
/* ============================================================
   LITTLE AUTOMATION
   Extend the game by editing the registries below:
   RES (resources), RECIPES (smelter), MACHINES, LEVELS.
   ============================================================ */
const CELL = 48, BASE_MS = 400, KEY = 'littleAutomation.v2';
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];   // dir: 0=right 1=down 2=left 3=up

/* ---------- Resources ---------- */
const RES = {
  ironOre:     { name: 'Iron ore',     color: '#7f8fa6', shape: 'dot' },
  copperOre:   { name: 'Copper ore',   color: '#d9822b', shape: 'dot' },
  ironIngot:   { name: 'Iron ingot',   color: '#aebdd0', shape: 'bar' },
  copperIngot: { name: 'Copper ingot', color: '#f0a65a', shape: 'bar' },
  gear:        { name: 'Gear',         color: '#5d6b7d', shape: 'sq' },
  circuit:     { name: 'Circuit',      color: '#3fae6a', shape: 'sq' },
  coal:        { name: 'Coal',         color: '#3a3f47', shape: 'dot' },
  plate:       { name: 'Iron plate',   color: '#6f8aa8', shape: 'sq' },
  wire:        { name: 'Copper wire',  color: '#e2602f', shape: 'sq' },
  steel:       { name: 'Steel',        color: '#34495e', shape: 'bar' },
  motor:       { name: 'Motor',        color: '#8e44ad', shape: 'sq' },
  battery:     { name: 'Battery',      color: '#d4b106', shape: 'sq' },
  sand:        { name: 'Sand',         color: '#d8c36a', shape: 'dot' },
  glass:       { name: 'Glass',        color: '#6fcbe6', shape: 'sq' },
  lamp:        { name: 'Lamp',         color: '#ffc928', shape: 'sq' },
  solar:       { name: 'Solar panel',  color: '#2c5fbf', shape: 'sq' }
};
const PRESS = { ironIngot: 'plate', copperIngot: 'wire' };
const RECIPES = { ironOre: 'ironIngot', copperOre: 'copperIngot', sand: 'glass' };   // smelter input -> output
const ASSEMBLE = [   // assembler recipes: inputs -> output
  { in: { ironIngot: 2 }, out: 'gear' },
  { in: { gear: 1, copperIngot: 2 }, out: 'circuit' },
  { in: { plate: 2, coal: 1 }, out: 'steel' },
  { in: { gear: 1, wire: 2 }, out: 'motor' },
  { in: { plate: 1, wire: 1, coal: 1 }, out: 'battery' },
  { in: { glass: 1, wire: 1 }, out: 'lamp' },
  { in: { glass: 2, circuit: 1 }, out: 'solar' }
];
const recs = () => { const A = LEVELS[li].asm || ['gear', 'circuit']; return ASSEMBLE.filter(r => A.includes(r.out)); };

/* ---------- Machines ----------
   dir:true      -> has an output direction
   accept(c,it)  -> can this cell take item `it` right now?
   put(c,it,d)   -> receive item (d = direction it travelled)
   tick(c,x,y)   -> per-tick internal work; set c.item to emit an item           */
const MACHINES = {
  miner: {
    name: 'Miner', key: '1', color: '#e8a93a', label: 'M', dir: true, needsOre: true,
    accept: () => false,
    tick(c, x, y) { if (c.item) return; if (++c.prog >= 2) { c.prog = 0; c.item = oreMap[x + ',' + y]; } }
  },
  conveyor: {
    name: 'Conveyor', key: '2', color: '#5b6b7d', dir: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; }
  },
  smelter: {
    name: 'Smelter', key: '3', color: '#c8453d', label: 'S', dir: true,
    accept: (c, it) => RECIPES[it] && c.inp.length < 2,
    put(c, it) { c.inp.push(it); },
    tick(c) { if (c.item || !c.inp.length) return; if (++c.prog >= 4) { c.prog = 0; c.item = RECIPES[c.inp.shift()]; } }
  },
  storage: {
    name: 'Storage', key: '4', color: '#2f9e6b', label: 'ST',
    accept: () => true,
    put(c, it) { sim.stored[it] = (sim.stored[it] || 0) + 1; }
  },
  splitter: {   // sends items alternately to every side except the one they came from
    name: 'Splitter', key: '5', color: '#3b82c4', label: 'Y', belt: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; c.from = d; },
    outs: c => [0, 1, 2, 3].filter(d => d !== (c.from + 2) % 4)
  },
  sorter: {     // matching items go straight, everything else goes out the sides
    name: 'Sorter', key: '6', color: '#b9558f', label: 'F', dir: true, belt: true, cfg: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; },
    outs: c => c.item === c.f ? [c.dir] : [(c.dir + 1) % 4, (c.dir + 3) % 4]
  },
  junction: {   // lets two belts cross: items keep going straight
    name: 'Junction', key: '7', color: '#a8873a', label: '+', belt: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; c.from = d; },
    outs: c => [c.from]
  },
  assembler: {
    name: 'Assembler', key: '8', color: '#5b5bd6', label: 'A', dir: true,
    accept: (c, it) => (c.inv[it] || 0) < 2 && recs().some(r => it in r.in),
    put(c, it) { c.inv[it] = (c.inv[it] || 0) + 1; },
    tick(c) {
      if (c.item) return;
      const r = recs().find(r => Object.entries(r.in).every(([k, n]) => (c.inv[k] || 0) >= n));
      if (!r) { c.prog = 0; return; }
      if (++c.prog >= 5) { c.prog = 0; for (const k in r.in) c.inv[k] -= r.in[k]; c.item = r.out; }
    }
  },
  crusher: {    // doubles ore: every ore in comes out twice
    name: 'Crusher', key: 'u', color: '#9c6644', label: 'D', dir: true,
    accept: (c, it) => /Ore$|^sand$|^coal$/.test(it) && c.inp.length < 2,
    put(c, it) { c.inp.push(it); },
    tick(c) { if (c.item || !c.inp.length) return; if (++c.prog >= 3) { c.prog = 0; c.item = c.inp[0]; c.inv.x = (c.inv.x || 0) + 1; if (c.inv.x >= 2) { c.inv.x = 0; c.inp.shift(); } } }
  },
  buffer: {     // holds up to 4 items so belts keep moving
    name: 'Buffer', key: 'v', color: '#4d908e', label: 'U', dir: true,
    accept: c => c.inp.length < 4,
    put(c, it) { c.inp.push(it); },
    tick(c) { if (!c.item && c.inp.length) c.item = c.inp.shift(); }
  },
  press: {
    name: 'Press', key: 'p', color: '#8e6bbf', label: 'P', dir: true,
    accept: (c, it) => PRESS[it] && c.inp.length < 2,
    put(c, it) { c.inp.push(it); },
    tick(c) { if (c.item || !c.inp.length) return; if (++c.prog >= 3) { c.prog = 0; c.item = PRESS[c.inp.shift()]; } }
  },
  overflow: {   // straight ahead first; out the sides only when the front is blocked
    name: 'Overflow', key: 'o', color: '#2a9d8f', label: 'O', dir: true, belt: true, prio: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; },
    outs: c => [c.dir, (c.dir + 1) % 4, (c.dir + 3) % 4]
  },
  bridge: {     // jumps over up to 3 tiles to the next bridge facing the same way
    name: 'Bridge', key: 'b', color: '#6d6875', label: 'B', dir: true, belt: true,
    accept: c => !c.item,
    put(c, it, d) { c.item = it; c.mv = sim.tick; c.slide = d; c.fb = false; },
    outs: c => [c.dir]
  },
  trash: {
    name: 'Trash', key: '9', color: '#7b8794', label: 'X',
    accept: () => true, put() {}
  }
};

/* ---------- Levels ----------
   ore: [x, y, resource] tiles. goals: resources that must reach storage. */
const O = (r, ...p) => p.map(([x, y]) => [x, y, r]);                       // ore tiles
const RK = (x, a, b) => Array.from({ length: b - a + 1 }, (_, i) => [x, a + i]);   // vertical rocks
// Fixed machines ([x, y, type, dir]) are pre-placed and cannot be changed.
const FEED = [[1, 2, 'miner', 0], [2, 2, 'conveyor', 1], [2, 3, 'conveyor', 1], [1, 4, 'miner', 0], [2, 4, 'conveyor', 0]];
const MIXED = [...O('ironOre', [1, 2]), ...O('copperOre', [1, 4])];
const LEVELS0 = [
  { id: 'a1', title: '1. First ore', w: 10, h: 6, tools: ['miner', 'conveyor', 'storage'],
    ore: O('ironOre', [1, 2], [1, 3]), goals: [{ res: 'ironOre', n: 10 }],
    hint: 'Put a miner on an ore tile, run a conveyor from it, and end the line in a storage. Press Play.' },
  { id: 'a2', title: '2. Hot stuff', w: 11, h: 6, tools: ['miner', 'conveyor', 'smelter', 'storage'],
    ore: O('ironOre', [1, 2], [1, 3]), goals: [{ res: 'ironIngot', n: 10 }],
    hint: 'A smelter turns ore into ingots. Machines output in the direction of their arrow; press R to rotate before placing.' },
  { id: 'a3', title: '3. Split it', w: 12, h: 7, tools: ['miner', 'conveyor', 'splitter', 'smelter', 'storage'],
    ore: O('ironOre', [1, 3]), goals: [{ res: 'ironIngot', n: 40 }],
    hint: 'One ore tile, but a miner is twice as fast as a smelter. A splitter shares items between outputs so two smelters can work at once.' },
  { id: 'a4', title: '4. Two metals', w: 13, h: 7, tools: ['miner', 'conveyor', 'smelter', 'storage'],
    ore: [...O('ironOre', [1, 1], [1, 2]), ...O('copperOre', [11, 4], [11, 5])],
    goals: [{ res: 'ironIngot', n: 10 }, { res: 'copperIngot', n: 10 }],
    hint: 'Iron on the left, copper on the right. Smelters work with either ore, and one storage takes both.' },
  { id: 'a5', title: '5. Cogs', w: 12, h: 6, tools: ['miner', 'conveyor', 'smelter', 'assembler', 'storage'],
    ore: O('ironOre', [1, 2], [1, 3], [1, 4]), goals: [{ res: 'gear', n: 8 }],
    hint: 'An assembler combines ingredients into a new item. Check the recipes card, then feed it ingots.' },
  { id: 'a6', title: '6. Mixed feed', w: 13, h: 7, tools: ['conveyor', 'smelter', 'sorter', 'assembler', 'trash', 'storage'],
    ore: MIXED, pre: FEED, goals: [{ res: 'gear', n: 10 }],
    hint: 'Fixed miners (dark dot) send iron and copper down one belt. An assembler jams on items it cannot use. Sort the stream with a sorter (set its filter with the Config tool) and bin the junk in the trash.' },
  { id: 'a7', title: '7. Circuits', w: 14, h: 8, tools: ['miner', 'conveyor', 'smelter', 'assembler', 'storage'],
    ore: [...O('ironOre', [1, 2], [1, 3]), ...O('copperOre', [1, 5], [1, 6])], goals: [{ res: 'circuit', n: 6 }],
    hint: 'Circuits need a gear and two copper ingots. Make gears in one assembler and feed them into another.' },
  { id: 'a8', title: '8. Crossing', w: 13, h: 7, tools: ['miner', 'conveyor', 'smelter', 'junction', 'storage'],
    ore: [...O('ironOre', [1, 3]), ...O('copperOre', [6, 0])],
    pre: [[6, 0, 'miner', 1], [6, 1, 'conveyor', 1], [6, 2, 'conveyor', 1], [6, 4, 'conveyor', 1], [6, 5, 'conveyor', 1], [6, 6, 'storage', 0]],
    goals: [{ res: 'ironIngot', n: 10 }, { res: 'copperOre', n: 10 }],
    hint: 'A fixed belt blocks the way. Fill the gap in it with a junction so both lines cross without mixing.' },
  { id: 'a9', title: '9. Rocky road', w: 14, h: 8, tools: ['miner', 'conveyor', 'smelter', 'storage'],
    ore: O('ironOre', [1, 1], [1, 2]), rocks: [...RK(5, 0, 5), ...RK(9, 2, 7)], goals: [{ res: 'ironIngot', n: 20 }],
    hint: 'Rocks cannot be built on. Wind your line through the gaps.' },
  { id: 'a10', title: '10. Sorting hat', w: 13, h: 8, tools: ['conveyor', 'smelter', 'sorter', 'assembler', 'storage'],
    ore: MIXED, pre: FEED, goals: [{ res: 'gear', n: 6 }, { res: 'copperIngot', n: 12 }],
    hint: 'This time the copper is wanted too. Split the smelted stream: iron to the assembler, copper to storage.' },
  { id: 'a11', title: '11. Big order', w: 14, h: 8, tools: ['miner', 'conveyor', 'splitter', 'smelter', 'storage'],
    ore: [...O('ironOre', [1, 3]), ...O('copperOre', [12, 4])],
    goals: [{ res: 'ironIngot', n: 30 }, { res: 'copperIngot', n: 20 }],
    hint: 'Only one ore tile of each metal. Make every miner count with splitters and several smelters.' },
  { id: 'a12', title: 'Full factory', w: 16, h: 9, tools: ['miner', 'conveyor', 'splitter', 'smelter', 'assembler', 'storage'],
    ore: [...O('ironOre', [1, 1], [1, 2], [1, 3], [1, 4]), ...O('copperOre', [1, 6], [1, 7])],
    rocks: RK(8, 2, 6), goals: [{ res: 'circuit', n: 8 }, { res: 'gear', n: 6 }],
    hint: 'Build a line for circuits and one for spare gears. Splitters help share the iron.' },
  { id: 'b1', title: 'Pressing matters', w: 11, h: 6, tools: ['miner', 'conveyor', 'smelter', 'press', 'storage'],
    ore: O('ironOre', [1, 2], [1, 3]), goals: [{ res: 'plate', n: 10 }],
    hint: 'A press flattens ingots into plates (or draws copper into wire). Smelt first, then press.' },
  { id: 'b2', title: 'Overflow', w: 12, h: 7, tools: ['miner', 'conveyor', 'overflow', 'smelter', 'storage'],
    ore: O('ironOre', [1, 3]), goals: [{ res: 'ironIngot', n: 12 }, { res: 'ironOre', n: 12 }],
    hint: 'An overflow gate sends items straight ahead, and out its sides only when the front is blocked. Put one before the smelter and catch the spare ore.' },
  { id: 'b3', title: 'Over the wall', w: 12, h: 7, tools: ['miner', 'conveyor', 'bridge', 'smelter', 'storage'],
    ore: O('ironOre', [1, 3]), rocks: [...RK(6, 0, 6), ...RK(7, 0, 6)], goals: [{ res: 'ironIngot', n: 10 }],
    hint: 'Bridges jump over up to 3 tiles. Place one facing the wall and another facing the same way on the far side.' },
  { id: 'b4', title: 'Wire and plate', w: 12, h: 7, tools: ['miner', 'conveyor', 'smelter', 'press', 'storage'],
    ore: [...O('ironOre', [1, 1], [1, 2]), ...O('copperOre', [1, 4], [1, 5])], goals: [{ res: 'plate', n: 8 }, { res: 'wire', n: 8 }],
    hint: 'Two metals, two presses. Keep the lines apart.' },
  { id: 'b5', title: 'Motors', w: 14, h: 8, tools: ['miner', 'conveyor', 'smelter', 'press', 'assembler', 'storage'], asm: ['gear', 'motor'],
    ore: [...O('ironOre', [1, 1], [1, 2]), ...O('copperOre', [1, 5], [1, 6])], goals: [{ res: 'motor', n: 4 }],
    hint: 'A motor needs a gear and 2 wire. Make gears in one assembler, wire in a press, and combine them in another assembler.' },
  { id: 'b6', title: 'Steel', w: 13, h: 8, tools: ['miner', 'conveyor', 'smelter', 'press', 'assembler', 'storage'], asm: ['steel'],
    ore: [...O('ironOre', [1, 2], [1, 3]), ...O('coal', [1, 6])], goals: [{ res: 'steel', n: 5 }],
    hint: 'Steel is 2 plates and 1 coal. Coal needs no smelting; send it straight to the assembler.' },
  { id: 'b7', title: 'Batteries', w: 15, h: 9, tools: ['miner', 'conveyor', 'smelter', 'press', 'assembler', 'storage'], asm: ['battery'],
    ore: [...O('ironOre', [1, 1], [1, 2]), ...O('copperOre', [1, 4], [1, 5]), ...O('coal', [1, 7])], goals: [{ res: 'battery', n: 4 }],
    hint: 'A battery is 1 plate, 1 wire and 1 coal. Three belts, one assembler.' },
  { id: 'b10', title: 'Coal or ore?', w: 14, h: 8, tools: ['conveyor', 'smelter', 'press', 'sorter', 'assembler', 'storage'], asm: ['steel'],
    ore: [...O('ironOre', [1, 2]), ...O('coal', [1, 4])], pre: FEED, goals: [{ res: 'steel', n: 4 }],
    hint: 'The fixed feed mixes iron ore and coal on one belt. Use a sorter (Config sets its filter) to pull the coal out.' },
  { id: 'b9', title: 'Bridge and cross', w: 14, h: 8, tools: ['miner', 'conveyor', 'junction', 'bridge', 'smelter', 'storage'],
    ore: [...O('ironOre', [1, 3]), ...O('copperOre', [3, 0])], rocks: RK(8, 0, 7),
    pre: [[3, 0, 'miner', 1], [3, 1, 'conveyor', 1], [3, 2, 'conveyor', 1], [3, 4, 'conveyor', 1], [3, 5, 'conveyor', 1], [3, 6, 'storage', 0]],
    goals: [{ res: 'ironIngot', n: 10 }, { res: 'copperOre', n: 10 }],
    hint: 'A fixed belt on one side, a rock wall on the other. Cross the belt with a junction, then bridge the wall.' },
  { id: 'b8', title: 'Overflow chain', w: 15, h: 8, tools: ['miner', 'conveyor', 'splitter', 'overflow', 'smelter', 'press', 'storage'],
    ore: O('ironOre', [1, 2], [1, 5]), goals: [{ res: 'ironIngot', n: 20 }, { res: 'plate', n: 12 }],
    hint: 'Fill the ingot order first, and let overflow gates send the extra to the presses.' },
  { id: 'b11', title: 'Grand factory', w: 17, h: 10, tools: ['miner', 'conveyor', 'splitter', 'junction', 'smelter', 'press', 'assembler', 'storage'], asm: ['gear', 'motor', 'battery'],
    ore: [...O('ironOre', [1, 1], [1, 2], [1, 3]), ...O('copperOre', [1, 6], [1, 7]), ...O('coal', [1, 9])], rocks: RK(9, 3, 6),
    goals: [{ res: 'motor', n: 3 }, { res: 'battery', n: 3 }],
    hint: 'Motors and batteries from three ores. Plan your belts before you build.' },
  { id: 'c1', title: 'Sand to glass', w: 11, h: 6, tools: ['miner', 'conveyor', 'smelter', 'storage'],
    ore: O('sand', [1, 2], [1, 3]), goals: [{ res: 'glass', n: 10 }],
    hint: 'Smelters melt sand into glass too.' },
  { id: 'c2', title: 'Lamps', w: 13, h: 7, tools: ['miner', 'conveyor', 'smelter', 'press', 'assembler', 'storage'], asm: ['lamp'],
    ore: [...O('sand', [1, 1], [1, 2]), ...O('copperOre', [1, 4], [1, 5])], goals: [{ res: 'lamp', n: 5 }],
    hint: 'A lamp is a glass and a wire. Melt the sand, draw the wire, assemble.' },
  { id: 'c3', title: 'Double up', w: 13, h: 7, tools: ['miner', 'conveyor', 'crusher', 'splitter', 'smelter', 'storage'],
    ore: O('ironOre', [1, 3]), goals: [{ res: 'ironIngot', n: 30 }],

    while (sim.running && now - sim.last >= ms) { step(); sim.last += ms; }
  }
  render(now); requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
sim.speed = [1, 2, 4].includes(save.speed) ? save.speed : 1;
let start = Math.min(Math.max(+save.level || 0, 0), LEVELS.length - 1);
while (start > 0 && !save.completed[LEVELS[start - 1].id]) start--;
loadLevel(start);
requestAnimationFrame(frame);
</script>
</body>
</html>
