<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Packs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        kawaii: {
                            pink: '#fff0f5',
                            hotpink: '#ff6eb4',
                            header: '#ffb6c1',
                            dark: '#222222',
                            common: '#94a3b8',
                            uncommon: '#4ade80',
                            rare: '#60a5fa',
                            mythic: '#fbbf24',
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'shake': 'shake 0.5s ease-in-out infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'rotate-slow': 'rotate 15s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(-5deg)' },
                            '75%': { transform: 'rotate(5deg)' },
                        },
                        rotate: {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(360deg)' },
                        },
                        popIn: {
                            '0%': { transform: 'scale(0)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1a1a;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        .rays {
            position: absolute;
            width: 800px;
            height: 800px;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 255, 255, 0.2) 0deg 15deg,
                transparent 15deg 30deg
            );
            z-index: 0;
        }

        .btn-shadow {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        }

        .btn-shadow:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1);
        }

        .rarity-Common { background: linear-gradient(135deg, #e2e8f0, #94a3b8); }
        .rarity-Uncommon { background: linear-gradient(135deg, #bbf7d0, #4ade80); }
        .rarity-Rare { background: linear-gradient(135deg, #bfdbfe, #60a5fa); }
        .rarity-Mythic { background: linear-gradient(135deg, #fef08a, #fbbf24); }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen font-sans">

    <div id="app" class="relative w-full max-w-[450px] h-full sm:h-[90vh] sm:rounded-[40px] shadow-2xl overflow-hidden bg-kawaii-pink flex flex-col">
        
        <!-- Global Header -->
        <header class="absolute top-0 left-0 w-full z-20 bg-kawaii-header py-6 px-4 text-center shadow-lg border-b-4 border-pink-200">
            <h1 id="header-title" class="font-display font-black text-white text-2xl uppercase tracking-wider drop-shadow-[0_2px_0_rgba(216,27,96,1)]">
                Mystery Packs
            </h1>
        </header>

        <!-- Home Screen -->
        <div id="home-screen" class="screen active flex-col items-center justify-center p-8 h-full pt-24">

                    <rect x="40" y="60" width="120" height="100" rx="10" fill="#ff6eb4" />
                    <rect x="40" y="60" width="120" height="30" rx="10" fill="#ffb6c1" />
                    <path d="M100 40 L120 60 L80 60 Z" fill="#ff6eb4" />
                    <circle cx="100" cy="110" r="25" fill="white" opacity="0.3" />
                    <text x="100" y="115" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">?</text>
                    <rect x="70" y="145" width="60" height="8" rx="4" fill="white" opacity="0.4" />
                </svg>
            </div>
            
            <div class="flex flex-col gap-4 w-full max-w-xs">
                <button onclick="startOpenBox()" class="btn-shadow bg-kawaii-hotpink text-white font-black py-5 px-8 rounded-full text-xl uppercase tracking-widest transition-all">
                    Open Pack
                </button>
                <button onclick="showCollection()" class="btn-shadow bg-white text-kawaii-hotpink border-4 border-kawaii-hotpink font-black py-4 px-8 rounded-full text-lg uppercase tracking-widest transition-all">
                    Collection
                </button>
            </div>
        </div>

        <!-- Box Screen (Opening) -->
        <div id="box-screen" class="screen flex-col items-center justify-center h-full pt-24">
            <div class="animate-shake w-64 h-64">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <rect x="40" y="60" width="120" height="100" rx="10" fill="#ff6eb4" />
                    <rect x="40" y="60" width="120" height="30" rx="10" fill="#ffb6c1" />
                    <path d="M100 40 L120 60 L80 60 Z" fill="#ff6eb4" />
                    <text x="100" y="115" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">...</text>
                </svg>
            </div>
            <p class="mt-8 font-black text-kawaii-hotpink text-2xl animate-pulse uppercase tracking-widest">Opening...</p>
        </div>

        <!-- Reveal Screen -->
        <div id="reveal-screen" class="screen flex-col items-center justify-center h-full relative overflow-hidden">
            <div class="rays animate-rotate-slow"></div>
            
            <div class="reveal-content relative z-10 flex flex-col items-center p-6 w-full animate-pop-in">
                <div id="new-badge" class="hidden absolute top-0 -right-4 bg-yellow-400 text-kawaii-dark font-black px-4 py-1 rounded-full shadow-lg rotate-12 text-sm z-20">NEW!</div>
                
                <div id="char-display" class="w-64 h-64 mb-6 drop-shadow-[0_20px_35px_rgba(0,0,0,0.3)]">
                    <!-- Character SVG injected here -->
                </div>

                <div class="text-center bg-white/90 p-6 rounded-3xl shadow-xl w-full max-w-xs border-b-4 border-gray-200">
                    <h2 id="char-name" class="font-display font-black text-3xl text-kawaii-dark mb-1">Character</h2>
                    <p id="char-rarity" class="font-bold text-kawaii-hotpink uppercase tracking-widest text-sm mb-4">Common</p>
                    <button onclick="nav('home-screen', 'Blind Box Shop')" class="btn-shadow bg-kawaii-hotpink text-white font-black py-4 px-8 rounded-full text-lg w-full transition-all">
                        Collect
                    </button>
                </div>
            </div>
        </div>

        <!-- Collection Screen -->
        <div id="collection-screen" class="screen flex-col h-full pt-24 pb-8 px-6">
            <div class="w-full bg-white rounded-3xl p-5 shadow-inner mb-6 border-b-4 border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-black text-kawaii-hotpink uppercase text-sm tracking-tighter">Collection Progress</span>
                    <span id="progress-text" class="font-black text-kawaii-dark">0 / 25</span>
                </div>
                <div class="w-full h-4 bg-gray-100 rounded-full overflow-hidden">
                    <div id="progress-fill" class="h-full bg-kawaii-hotpink transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div id="collection-grid" class="grid grid-cols-4 gap-3 overflow-y-auto pr-1 pb-20">
                <!-- Grid items injected here -->
            </div>

            <div class="absolute bottom-6 left-0 w-full px-8 flex justify-center z-20">
                <button onclick="nav('home-screen', 'Blind Box Shop')" class="btn-shadow bg-kawaii-dark text-white font-black py-4 px-12 rounded-full text-lg transition-all w-full max-w-xs">
                    Back
                </button>
            </div>
        </div>

        let collection = JSON.parse(localStorage.getItem('blind_box_collection')) || {};

        function saveCollection() {
            localStorage.setItem('blind_box_collection', JSON.stringify(collection));
        }

        function renderChar(c, isSil = false) {
            const fill = isSil ? '#cbd5e1' : c.c;
            const eyeColor = isSil ? '#94a3b8' : (c.we ? 'white' : '#333333');
            
            let svg = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">`;
            
            // Shadows and Body
            if (!isSil) {
                svg += `<ellipse cx="100" cy="180" rx="60" ry="15" fill="black" opacity="0.1" />`;
            }
            
            // Specific parts
            svg += `<g fill="${fill}" stroke="${isSil ? 'none' : 'rgba(0,0,0,0.05)'}" stroke-width="2">`;
            svg += c.f || ''; // Feature extras (ears, etc)
            svg += `<path d="${c.b}" />`; // Body
            svg += `<path d="${c.l}" stroke="${isSil ? 'none' : 'rgba(0,0,0,0.1)'}" stroke-width="5" fill="none" />`; // Legs
            svg += `</g>`;

            // Face
            if (c.id !== 'ghost') {
                svg += `<g fill="${eyeColor}">
                    <circle cx="85" cy="100" r="6" />
                    <circle cx="115" cy="100" r="6" />
                </g>`;
                if (!isSil) {
                    svg += `<path d="M95,115 Q100,120 105,115" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" />`;
                    svg += `<circle cx="75" cy="110" r="5" fill="#ffb6c1" opacity="0.6" />`;
                    svg += `<circle cx="125" cy="110" r="5" fill="#ffb6c1" opacity="0.6" />`;
                }
            } else if (!isSil) {
                svg += c.f; // Ghost has special face
            } else {
                 svg += `<g fill="${eyeColor}">
                    <circle cx="85" cy="100" r="6" />
                    <circle cx="115" cy="100" r="6" />
                </g>`;
            }

            svg += `</svg>`;
            return svg;
        }

        function nav(screenId, title) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.getElementById('header-title').innerText = title;
        }

        function startOpenBox() {
            nav('box-screen', 'Opening...');
            setTimeout(() => revealChar(), 1500);
        }

        function revealChar() {
            const rng = Math.random() * 100;
            let rarity = 'Common';
            
            if (rng > 99.95) rarity = 'Mythic';
            else if (rng > 92) rarity = 'Rare';
            else if (rng > 60) rarity = 'Uncommon';

            const pool = DB.filter(c => c.r === rarity);
            const char = pool[Math.floor(Math.random() * pool.length)];

            const isNew = !collection[char.id];
            collection[char.id] = (collection[char.id] || 0) + 1;
            saveCollection();

            // Setup reveal screen
            const screen = document.getElementById('reveal-screen');
            screen.className = `screen active flex-col items-center justify-center h-full relative overflow-hidden rarity-${rarity}`;
            
            document.getElementById('char-display').innerHTML = renderChar(char);
            document.getElementById('char-name').innerText = char.n;
            document.getElementById('char-rarity').innerText = char.r;
            
            const badge = document.getElementById('new-badge');
            if (isNew) badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            nav('reveal-screen', 'You Got!');
        }

        function showCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            
            let unlocked = 0;
            DB.forEach(char => {
                const count = collection[char.id] || 0;
                if (count > 0) unlocked++;
                
                const cell = document.createElement('div');
                cell.className = `relative aspect-square rounded-2xl flex items-center justify-center p-2 shadow-sm ${count > 0 ? 'bg-white' : 'bg-slate-200'}`;
                
                cell.innerHTML = renderChar(char, count === 0);
                
                if (count > 1) {
                    const badge = document.createElement('div');
                    badge.className = "absolute -top-1 -right-1 bg-kawaii-hotpink text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white";
                    badge.innerText = count;
                    cell.appendChild(badge);
                }
                
                grid.appendChild(cell);
            });

            const progress = Math.round((unlocked / DB.length) * 100);
            document.getElementById('progress-text').innerText = `${unlocked} / ${DB.length}`;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            nav('collection-screen', 'Collection');
        }

        // Initialize
        window.onload = () => {
            // Optional: Pre-warm animations or sound logic here
        };
    </script>
</body>
</html>
