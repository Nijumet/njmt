box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--panel:#1c1e28;--ink:#ece8dc;--mut:#8f8b7d;--line:#33364a;--chip:#252837;--acc:#8fa8ff;--base:#26305a;--last:#6b5a1f}}
:root[data-theme="dark"]{--bg:#14151c;--panel:#1c1e28;--ink:#ece8dc;--mut:#8f8b7d;--line:#33364a;--chip:#252837;--acc:#8fa8ff;--base:#26305a;--last:#6b5a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.base{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--chip);font-size:14px;white-space:nowrap}
.pill.b{background:var(--base)}
.search{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:280px;overflow:auto;z-index:5;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sug div{padding:9px 12px;cursor:pointer}
#sug div.on,#sug div:hover{background:var(--base)}
#out{margin-top:18px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
ol{list-style:none;margin:0;padding:0;counter-reset:s}
li.step{counter-increment:s;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:9px 10px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
li.step::before{content:counter(s);min-width:26px;color:var(--mut);font-size:13px}
li.step.last{background:var(--last)}
.op{color:var(--mut)}
.note{font-size:12px;color:var(--mut);width:100%;padding-left:32px}
.msg{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--mut)}
.eotm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 14px;padding:12px 14px;background:var(--last);border:1px solid var(--line);border-radius:12px}
.eotm .lbl{width:100%;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
.eotm .nm{flex:1;min-width:0;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.eotm .meta{font-size:13px;color:var(--mut);white-space:nowrap}
.simple{font-size:13px;color:var(--mut);margin-top:12px}
</style>
</head>

<h1>Element Crafter Guide</h1>
<p class="sub">Type any element to get the shortest step-by-step recipe path from the five starting elements.</p>
<div class="base" id="base"></div>
<div class="eotm" id="eotm" aria-live="off"></div>

<div id="out"></div>
<p class="simple">Each step uses elements you already own (starting elements or earlier steps). Once you've made an element you can tap it again in your list to get extra copies.</p>
</main>

    var bits=p.n.toString(2),v=1;
    for(var j=1;j<bits.length;j++){
      var d=v*2;steps.push({a:nm(v),b:nm(v),r:nm(d),e:"♾️",tier:1});v=d;
      if(bits[j]==="1"){steps.push({a:nm(v),b:nm(1),r:nm(v+1),e:"♾️",tier:1});v++;}
    }
  }
  return steps;
}
function emo(n){
  if(EM[n])return EM[n];
  if(/^Eternal /.test(n))return "♾️";
  var m=n.match(/^(Greater|Mighty|Legendary|Divine|Cosmic) /);
  return m?TEM[TIERS.indexOf(m[1])]:"";
}
function pill(n,base){var s=document.createElement("span");s.className="pill"+(base?" b":"");s.textContent=emo(n)+" "+n;return s;}
var baseEl=document.getElementById("base");
BASE.forEach(function(b){baseEl.appendChild(pill(b[0],true));});
var out=document.getElementById("out"),q=document.getElementById("q"),sug=document.getElementById("sug");
var names=Object.keys(best).filter(function(n){return best[n].length>0;}).sort(function(a,b){return a.localeCompare(b);});
var sel=-1,cur=[];
function norm(s){return s.trim().toLowerCase();}
function show(name){
  out.innerHTML="";
  var steps=plan(name);
  if(!steps){
    var d=document.createElement("div");d.className="msg";
    d.textContent=norm(name)?"I couldn't find \""+name.trim()+"\" with a reachable recipe. Check the spelling or pick one from the suggestions.":"";
    if(norm(name))out.appendChild(d);return;
  }
  if(!steps.length){var d2=document.createElement("div");d2.className="msg";d2.textContent=name+" is one of the five starting elements. Nothing to craft!";out.appendChild(d2);return;}
  var sum=document.createElement("div");sum.className="sum";
  var t=document.createElement("span");t.textContent=steps.length+" step"+(steps.length===1?"":"s")+" to make "+emo(steps[steps.length-1].r)+" "+steps[steps.length-1].r;
  var cb=document.createElement("button");cb.textContent="Copy as text";
  cb.onclick=function(){
    var txt=steps.map(function(s,i){return (i+1)+". "+s.a+" + "+s.b+" = "+s.r;}).join("\n");
    try{navigator.clipboard.writeText(txt).then(function(){cb.textContent="Copied!";setTimeout(function(){cb.textContent="Copy as text";},1200);});}catch(e){}
  };
  sum.appendChild(t);sum.appendChild(cb);out.appendChild(sum);
  var ol=document.createElement("ol");
  var made={};BASE.forEach(function(b){made[b[0]]=1;});
  steps.forEach(function(s,i){
    var li=document.createElement("li");li.className="step"+(i===steps.length-1?" last":"");
    var o1=document.createElement("span");o1.className="op";o1.textContent="+";
    var o2=document.createElement("span");o2.className="op";o2.textContent="=";
    li.appendChild(pill(s.a,BASE.some(function(b){return b[0]===s.a;})));li.appendChild(o1);
    li.appendChild(pill(s.b,BASE.some(function(b){return b[0]===s.b;})));li.appendChild(o2);
    li.appendChild(pill(s.r,false));
    if(s.a===s.b){var n=document.createElement("div");n.className="note";n.textContent="Combine two copies of "+s.a+" (tap it twice in your list).";li.appendChild(n);}
    ol.appendChild(li);
  });
  out.appendChild(ol);
}
function renderSug(){
  var v=norm(q.value);sug.innerHTML="";sel=-1;
  if(!v){sug.style.display="none";cur=[];return;}
  var starts=[],has=[];
  names.forEach(function(n){var l=n.toLowerCase();if(l.indexOf(v)===0)starts.push(n);else if(l.indexOf(v)>0)has.push(n);});
  cur=starts.concat(has).slice(0,12);
  if(!cur.length){sug.style.display="none";return;}
  cur.forEach(function(n,i){
    var d=document.createElement("div");d.textContent=emo(n)+" "+n;d.setAttribute("role","option");
    d.addEventListener("mousedown",function(e){e.preventDefault();pick(n);});
    sug.appendChild(d);
  });
  sug.style.display="block";
}
function pick(n){q.value=n;sug.style.display="none";show(n);}
q.addEventListener("input",function(){renderSug();var v=q.value.trim();
  var exact=names.concat(BASE.map(function(b){return b[0];})).filter(function(n){return n.toLowerCase()===v.toLowerCase();})[0];
  if(exact)show(exact);else if(parseTier(v))show(v);else if(!v)out.innerHTML="";});
q.addEventListener("keydown",function(e){
  var items=sug.children;
  if(e.key==="ArrowDown"&&cur.length){e.preventDefault();sel=(sel+1)%cur.length;}
  else if(e.key==="ArrowUp"&&cur.length){e.preventDefault();sel=(sel-1+cur.length)%cur.length;}
  else if(e.key==="Enter"){e.preventDefault();if(sel>=0)pick(cur[sel]);else if(cur.length&&!plan(q.value.trim()))pick(cur[0]);else{sug.style.display="none";show(q.value);}return;}
  else if(e.key==="Escape"){sug.style.display="none";return;}
  else return;
  for(var i=0;i<items.length;i++)items[i].classList.toggle("on",i===sel);
});
q.addEventListener("blur",function(){sug.style.display="none";});
q.addEventListener("focus",renderSug);
// ===== Element of the minute: seeded from the UTC minute, so everyone sees the same one =====
var POOL=names.slice().sort(function(a,b){return a<b?-1:a>b?1:0;}); // locale-independent order
function seedPick(minute){
  var t=(minute*2654435761+0x9E3779B9)>>>0; // mulberry32-style mix
  t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
  var r=((t^(t>>>14))>>>0)/4294967296;
  return POOL[Math.floor(r*POOL.length)];
}
var eotm=document.getElementById("eotm"),eMin=-1,eName="",eTimer=null;
function buildEotm(){
  eotm.innerHTML="";
  var l=document.createElement("div");l.className="lbl";l.textContent="⏱️ Element of the minute";
  var nm=document.createElement("div");nm.className="nm";nm.textContent=emo(eName)+" "+eName;
  var meta=document.createElement("div");meta.className="meta";
  var n=plan(eName);meta.textContent=n?n.length+" step"+(n.length===1?"":"s")+" · ":"";
  eTimer=document.createElement("span");meta.appendChild(eTimer);
  var b=document.createElement("button");b.textContent="Show recipe";
  b.onclick=function(){q.value=eName;sug.style.display="none";show(eName);out.scrollIntoView({behavior:"smooth",block:"nearest"});};
  eotm.appendChild(l);eotm.appendChild(nm);eotm.appendChild(meta);eotm.appendChild(b);
}
function tickEotm(){
  var now=Date.now(),m=Math.floor(now/60000);
  if(m!==eMin){eMin=m;eName=seedPick(m);buildEotm();}
  var left=60-Math.floor((now%60000)/1000);
  eTimer.textContent="changes in 0:"+(left<10?"0":"")+left;
}
if(POOL.length){tickEotm();setInterval(tickEotm,500);document.addEventListener("visibilitychange",tickEotm);}else{eotm.style.display="none";}
})();
</script>
