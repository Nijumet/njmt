<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #050508;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #1a1a24;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .glass-panel {
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .score-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }

        .divider-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .divider {
            height: 2rem;
            width: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin-top: 20px;
            padding: 15px 30px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .p1-score {
            color: #00f2ff;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            font-family: 'Outfit', sans-serif;
        }

        .p2-score {
            color: #ff00c8;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 0, 200, 0.6);
            font-family: 'Outfit', sans-serif;
        }

        #center-text {
            position: absolute;
            top: 40%;
            font-size: 84px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #center-text.show {
            opacity: 1;
            transform: scale(1);
        }

        #btn-restart {
            pointer-events: auto;
            margin-top: auto;
            margin-bottom: 100px;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
            display: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #btn-restart:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.5);
            background: #f0f0f0;
        }

        #controls-info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 2px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        #level-name {
            position: absolute;
            top: 112px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div class="scoreboard glass-panel">
                <div class="score-box">
                    <span class="score-label">Player 1</span>
                    <div class="p1-score" id="p1-score">0</div>
                </div>
                <div class="divider-wrap">
                    <div class="divider"></div>
                </div>
                <div class="score-box">
                    <span class="score-label">Player 2</span>
                    <div class="p2-score" id="p2-score">0</div>
                </div>
            </div>

            <div id="level-name"></div>

            <div id="center-text"></div>
            
            <button id="btn-restart" onclick="initGame()">Play Again</button>

            <div id="controls-info">
                <div>P1: <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span></div>
                <div>P2: <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span></div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const centerText = document.getElementById('center-text');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const restartBtn = document.getElementById('btn-restart');
    const levelNameEl = document.getElementById('level-name');

    // Game Constants
    const MAX_SCORE = 5;
    const P1_COLOR = '#00f2ff';
    const P2_COLOR = '#ff00c8';
    
    // Game State
    let p1Score = 0;
    let p2Score = 0;
    let gameState = 'MENU';
    let stateTimer = 0;
    let countdownValue = 3;
    let screenShake = 0;
    let camX = 0;
    let camY = 0;

    const keys = {};
    const prevKeys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    let players = [];
    let bullets = [];
    let particles = [];

    // ---------------------------------------------------------------
    // LEVELS
    // Every level is described for the LEFT half only; buildLevel()
    // mirrors it across x = 400, so layouts are symmetrical by construction.
    //   plats : { x, y, w, move?, spikes? }   x:'c' = centered on the arena
    //     move   : { axis:'x'|'y', range, speed, phase }  (mirrored automatically)
    //     spikes : [{ ox, w }] offset along the platform; ox:'c' = centered
    //   floor : [{ x, w }] spikes on the ground; x:'c' = centered
    // Centered platforms may only move on the y axis (keeps them symmetrical).
    // ---------------------------------------------------------------
    const W = 800;
    const GROUND_Y = 550;
    const SPIKE_H = 14;

    const LEVELS = [
        { name: 'Classic Arena',
          plats: [
            { x: 120, y: 400, w: 160 },
            { x: 'c', y: 250, w: 240 }
          ] },

        { name: 'Spike Pit',
          plats: [
            { x: 120, y: 400, w: 160 },
            { x: 'c', y: 250, w: 240 }
          ],
          floor: [ { x: 'c', w: 120 } ] },

        { name: 'Twin Peaks',
          plats: [
            { x: 60, y: 420, w: 140 },
            { x: 'c', y: 330, w: 200 },
            { x: 150, y: 230, w: 120 }
          ],
          floor: [ { x: 230, w: 70 } ] },

        { name: 'Needle Bridges',
          plats: [
            { x: 90, y: 420, w: 180, spikes: [ { ox: 70, w: 40 } ] },
            { x: 'c', y: 300, w: 240, spikes: [ { ox: 'c', w: 60 } ] },
            { x: 200, y: 190, w: 110 }
          ] },

        { name: 'Elevators',
          plats: [
            { x: 90, y: 400, w: 150, move: { axis: 'y', range: 70, speed: 0.022, phase: 0 } },
            { x: 250, y: 330, w: 90, move: { axis: 'y', range: 50, speed: 0.03, phase: 1.5 } },
            { x: 'c', y: 230, w: 200 }
          ] },

        { name: 'Shuttles',
          plats: [
            { x: 110, y: 430, w: 140, move: { axis: 'x', range: 60, speed: 0.02, phase: 0 } },
            { x: 150, y: 210, w: 120, move: { axis: 'x', range: 50, speed: 0.018, phase: 2 } },
            { x: 'c', y: 320, w: 160, move: { axis: 'y', range: 50, speed: 0.025, phase: 0 } }
          ] },

        { name: 'Spiked Lifts',
          plats: [
            { x: 80, y: 420, w: 160, move: { axis: 'y', range: 60, speed: 0.02, phase: 0 },
              spikes: [ { ox: 60, w: 40 } ] },
            { x: 'c', y: 280, w: 220, move: { axis: 'y', range: 40, speed: 0.03, phase: 1 } }
          ],
          floor: [ { x: 'c', w: 100 } ] },

        { name: 'Spike Floor Shuttle',
          plats: [
            { x: 160, y: 440, w: 120, move: { axis: 'x', range: 70, speed: 0.018, phase: 0 } },
            { x: 240, y: 230, w: 110 },
            { x: 'c', y: 340, w: 140, move: { axis: 'y', range: 60, speed: 0.025, phase: 0 } }
          ],
          floor: [ { x: 170, w: 230 } ] },

        { name: 'Gauntlet',
          plats: [
            { x: 70, y: 430, w: 130, move: { axis: 'y', range: 50, speed: 0.02, phase: 0 } },
            { x: 230, y: 340, w: 110, spikes: [ { ox: 35, w: 40 } ] },
            { x: 'c', y: 240, w: 160, move: { axis: 'y', range: 30, speed: 0.03, phase: 0 },
              spikes: [ { ox: 'c', w: 50 } ] }
          ],
          floor: [ { x: 'c', w: 80 }, { x: 250, w: 50 } ] },

        { name: 'Crossfire',
          plats: [
            { x: 110, y: 440, w: 150, move: { axis: 'x', range: 60, speed: 0.02, phase: 0 },
              spikes: [ { ox: 55, w: 40 } ] },
            { x: 200, y: 300, w: 110, move: { axis: 'y', range: 40, speed: 0.028, phase: 1 } },
            { x: 'c', y: 210, w: 140 }
          ],
          floor: [ { x: 'c', w: 160 } ] }
    ];

    let platforms = [];
    let spikes = [];
    let levelTime = 0;
    let roundNumber = 0;

    function buildLevel(index) {
        const spec = LEVELS[index];
        platforms = [
            { x: 0, y: GROUND_Y, w: W, h: 50, type: 'solid' }, // Ground
            { x: -50, y: 0, w: 50, h: 600, type: 'solid' },    // Left Wall
            { x: W, y: 0, w: 50, h: 600, type: 'solid' }       // Right Wall
        ];
        spikes = [];
        levelTime = 0;

        const makePlat = (x, item, dir) => {
            const p = { x, y: item.y, w: item.w, h: 12, type: 'jump-through',
                        baseX: x, baseY: item.y, dx: 0, dy: 0, move: null };
            if (item.move) {
                p.move = {
                    axis: item.move.axis,
                    range: item.move.range,
                    speed: item.move.speed,
                    phase: item.move.phase || 0,
                    dir: item.move.axis === 'x' ? dir : 1 // x-axis motion is mirrored
                };
            }
            platforms.push(p);
            return p;
        };
        const addPlatSpike = (parent, ox, w) => {
            spikes.push({ parent, ox, w, h: SPIKE_H, x: parent.x + ox, y: parent.y - SPIKE_H });
        };
        const addFloorSpike = (x, w) => {
            spikes.push({ parent: null, ox: 0, w, h: SPIKE_H, x, y: GROUND_Y - SPIKE_H });
        };

        spec.plats.forEach(item => {
            if (item.x === 'c') {
                const p = makePlat((W - item.w) / 2, item, 1);
                (item.spikes || []).forEach(s => {
                    if (s.ox === 'c') addPlatSpike(p, (item.w - s.w) / 2, s.w);
                    else {
                        addPlatSpike(p, s.ox, s.w);
                        addPlatSpike(p, item.w - s.ox - s.w, s.w);
                    }
                });
            } else {
                const L = makePlat(item.x, item, 1);
                const R = makePlat(W - item.x - item.w, item, -1);
                (item.spikes || []).forEach(s => {
                    addPlatSpike(L, s.ox, s.w);
                    addPlatSpike(R, item.w - s.ox - s.w, s.w);
                });
            }
        });

        (spec.floor || []).forEach(s => {
            if (s.x === 'c') addFloorSpike((W - s.w) / 2, s.w);
            else {
                addFloorSpike(s.x, s.w);
                addFloorSpike(W - s.x - s.w, s.w);
            }
        });
    }

    function updateMovers() {
        levelTime++;
        platforms.forEach(p => {
            if (!p.move) { p.dx = 0; p.dy = 0; return; }
            const o = Math.sin(levelTime * p.move.speed + p.move.phase) * p.move.range;
            const nx = p.baseX + (p.move.axis === 'x' ? o * p.move.dir : 0);
            const ny = p.baseY + (p.move.axis === 'y' ? o : 0);
            p.dx = nx - p.x;
            p.dy = ny - p.y;
            p.x = nx;
            p.y = ny;
        });
        spikes.forEach(s => {
            if (s.parent) {
                s.x = s.parent.x + s.ox;
                s.y = s.parent.y - s.h;
            }
        });
    }

    function spikeBox(s) {
        return { x: s.x + 3, y: s.y + 4, w: s.w - 6, h: s.h - 4 };
    }

    function playerBox(p) {
        return { x: p.x + 4, y: p.y + 6, w: p.w - 8, h: p.h - 6 };
    }

    function checkSpikes() {
        if (gameState !== 'PLAYING') return;
        const victims = players.filter(p => !p.dead && spikes.some(s => isAABB(playerBox(p), spikeBox(s))));
        if (victims.length === 2) {
            // Both touch spikes on the same frame: draw, nobody scores
            victims.forEach(v => {
                v.dead = true;
                spawnParticles(v.x + v.w/2, v.y + v.h/2, v.color, 30, 8, 'spark');
            });
            screenShake = 15;
            gameState = 'ROUND_OVER';
            stateTimer = 120;
            showCenterText('DRAW');
        } else if (victims.length === 1) {
            handleHit(victims[0].id);
        }
    }

    class Particle {
        constructor(x, y, color, speed, type) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.life = 1.0;
            this.type = type; // 'dust' or 'spark'
            this.decay = 0.02 + Math.random() * 0.03;
            this.size = type === 'spark' ? 2 + Math.random() * 3 : 4 + Math.random() * 4;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
            if (this.type === 'spark') {
                this.vy += 0.15; // Gravity on sparks
            } else {
                this.vy -= 0.05; // Drift up for dust
                this.vx *= 0.95;
            }
        }

        draw(ctx) {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class Bullet {
        constructor(x, y, vx, ownerId, color) {
            this.x = x;
            this.y = y;
            this.w = 14;
            this.h = 4;
            this.vx = vx;
            this.ownerId = ownerId;
            this.color = color;
            this.markedForDeletion = false;
        }

        update() {
            this.x += this.vx;
            
            // Wall Collision
            if (this.x < 0 || this.x > 800) {
                this.markedForDeletion = true;
                spawnParticles(this.x, this.y, this.color, 8, 4, 'spark');
            }

            // Platform Collision (only solid)
            platforms.forEach(p => {
                if (p.type === 'solid' && isAABB(this, p)) {
                    this.markedForDeletion = true;
                    spawnParticles(this.x, this.y, this.color, 8, 4, 'spark');
                }
            });

            // Player Collision
            players.forEach(p => {
                if (!p.dead && p.id !== this.ownerId && isAABB(this, p)) {
                    this.markedForDeletion = true;
                    handleHit(p.id);
                }
            });
        }

        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.shadowBlur = 0;
        }
    }

    class Player {
        constructor(id, x, y, color, controls, facing) {
            this.id = id;
            this.x = x;
            this.y = y;
            this.w = 30;
            this.h = 44;
            this.color = color;
            this.controls = controls;
            this.facing = facing; // 1 or -1

            this.vx = 0;
            this.vy = 0;
            this.acc = 0.8;
            this.maxSpeed = 6;
            this.fricGround = 0.85;
            this.fricAir = 0.98;
            this.gravity = 0.45;
            this.jumpForce = -22;
            this.terminalVelocity = 12;

            this.grounded = false;
            this.wasGrounded = false;
            this.standingOn = null;
            this.dead = false;
            this.canShoot = true;
            this.shootCooldown = 0;
        }

        update() {
            if (this.dead || gameState !== 'PLAYING') {
                this.vx *= this.fricGround;
                this.vy += this.gravity;
                this.y += this.vy;
                this.handlePlatformCollisions();
                return;
            }

            // Ride moving platforms
            if (this.standingOn) {
                this.x += this.standingOn.dx;
                this.y += this.standingOn.dy;
            }

            // Input
            if (keys[this.controls.left]) {
                this.vx -= this.acc;
                this.facing = -1;
            } else if (keys[this.controls.right]) {
                this.vx += this.acc;
                this.facing = 1;
            } else {
                this.vx *= (this.grounded ? this.fricGround : this.fricAir);
            }

            // Jump
            if (keys[this.controls.jump] && this.grounded) {
                this.vy = this.jumpForce;
                this.grounded = false;
                spawnParticles(this.x + this.w/2, this.y + this.h, '#fff', 5, 2, 'dust');
            }

            // Variable Jump Height
            if (!keys[this.controls.jump] && this.vy < -3) {
                this.vy *= 0.6;
            }

            // Shooting
            if (keys[this.controls.shoot] && this.canShoot) {
                const bulletX = this.facing === 1 ? this.x + this.w : this.x - 14;
                bullets.push(new Bullet(bulletX, this.y + 18, this.facing * 12, this.id, this.color));
                this.canShoot = false;
                this.shootCooldown = 25;
                spawnParticles(bulletX, this.y + 20, this.color, 4, 3, 'spark');
                screenShake = Math.max(screenShake, 3);
            }

            if (this.shootCooldown > 0) {
                this.shootCooldown--;
            } else {
                this.canShoot = true;
            }

            // Physics
            this.vx = Math.max(Math.min(this.vx, this.maxSpeed), -this.maxSpeed);
            this.vy += this.gravity;
            if (this.vy > this.terminalVelocity) this.vy = this.terminalVelocity;

            this.x += this.vx;
            this.handlePlatformCollisions('x');
            this.y += this.vy;
            this.handlePlatformCollisions('y');

            // Landing effect
            if (this.grounded && !this.wasGrounded) {
                spawnParticles(this.x + this.w/2, this.y + this.h, '#fff', 6, 2, 'dust');
            }
            this.wasGrounded = this.grounded;

            // Bounds
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > 800) this.x = 800 - this.w;
        }

        handlePlatformCollisions(axis) {
            this.grounded = false;
            if (axis !== 'x') this.standingOn = null;
            platforms.forEach(p => {
                if (p.type === 'solid') {
                    if (isAABB(this, p)) {
                        if (axis === 'x') {
                            if (this.vx > 0) this.x = p.x - this.w;
                            else if (this.vx < 0) this.x = p.x + p.w;
                            this.vx = 0;
                        } else {
                            if (this.vy > 0) {
                                this.y = p.y - this.h;
                                this.vy = 0;
                                this.grounded = true;
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h;
                                this.vy = 0;
                            }
                        }
                    }
                } else if (p.type === 'jump-through' && axis === 'y') {
                    // Only collide if falling and was above
                    if (this.vy >= 0 && this.y + this.h <= p.y + this.vy + 1 && this.y + this.h >= p.y - 5) {
                        if (this.x + this.w > p.x && this.x < p.x + p.w) {
                            // Check if player is NOT holding "down" to drop through (optional)
                            if (!keys[this.controls.shoot]) { 
                                this.y = p.y - this.h;
                                this.vy = 0;
                                this.grounded = true;
                                this.standingOn = p;
                            }
                        }
                    }
                }
            });
        }

        draw(ctx) {
            ctx.save();
            if (this.dead) {
                ctx.globalAlpha = 0.3;
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                ctx.rotate(Math.PI/2);
                ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));
            }

            // Body
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.shadowBlur = 0;

            // Eyes/Face
            ctx.fillStyle = 'white';
            const eyeX = this.facing === 1 ? this.x + 18 : this.x + 6;
            ctx.fillRect(eyeX, this.y + 10, 8, 4);

            // Weapon
            ctx.fillStyle = '#444';
            const gunX = this.facing === 1 ? this.x + 20 : this.x - 10;
            ctx.fillRect(gunX, this.y + 20, 20, 8);

            ctx.restore();
        }
    }

    function isAABB(r1, r2) {
        return r1.x < r2.x + r2.w &&
               r1.x + r1.w > r2.x &&
               r1.y < r2.y + r2.h &&
               r1.y + r1.h > r2.y;
    }

    function spawnParticles(x, y, color, count, speed, type) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color, speed, type));
        }
    }

    function handleHit(hitId) {
        if (gameState === 'GAME_OVER') return;
        const victim = players.find(p => p.id === hitId);
        const killer = players.find(p => p.id !== hitId);
        
        victim.dead = true;
        screenShake = 15;
        spawnParticles(victim.x + victim.w/2, victim.y + victim.h/2, victim.color, 30, 8, 'spark');
        
        if (killer.id === 1) p1Score++;
        else p2Score++;
        
        updateScoreUI();
        
        gameState = 'ROUND_OVER';
        stateTimer = 120;
    }

    function updateScoreUI() {
        p1ScoreEl.innerText = p1Score;
        p2ScoreEl.innerText = p2Score;
    }

    function showCenterText(txt, color = "white") {
        centerText.innerText = txt;
        centerText.style.color = color;
        centerText.classList.add('show');
    }

    function hideCenterText() {
        centerText.classList.remove('show');
    }

    function initGame() {
        p1Score = 0;
        p2Score = 0;
        roundNumber = 0;
        updateScoreUI();
        restartBtn.style.display = 'none';
        startRound();
    }

    function startRound() {
        bullets = [];
        particles = [];
        const levelIndex = roundNumber % LEVELS.length;
        buildLevel(levelIndex);
        levelNameEl.innerText = 'Round ' + (roundNumber + 1) + ' \u00b7 ' + LEVELS[levelIndex].name;
        roundNumber++;
        players = [
            new Player(1, 100, GROUND_Y - 44, P1_COLOR, { left: 'KeyA', right: 'KeyD', jump: 'KeyW', shoot: 'KeyS' }, 1),
            new Player(2, W - 100 - 30, GROUND_Y - 44, P2_COLOR, { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', shoot: 'ArrowDown' }, -1)
        ];
        
        gameState = 'COUNTDOWN';
        countdownValue = 3;
        stateTimer = 60;
        showCenterText("3");
    }

    function gameLoop() {
        updateLogic();
        render();
        requestAnimationFrame(gameLoop);
    }

    function updateLogic() {
        if (gameState === 'COUNTDOWN') {
            stateTimer--;
            if (stateTimer <= 0) {
                countdownValue--;
                if (countdownValue > 0) {
                    showCenterText(countdownValue);
                    stateTimer = 60;
                } else {
                    showCenterText("FIGHT!", "#fff");
                    gameState = 'PLAYING';
                    stateTimer = 40;
                }
            }
        } else if (gameState === 'PLAYING') {
            if (stateTimer > 0) {
                stateTimer--;
                if (stateTimer === 0) hideCenterText();
            }
        } else if (gameState === 'ROUND_OVER') {
            stateTimer--;
            if (stateTimer <= 0) {
                if ((p1Score >= MAX_SCORE || p2Score >= MAX_SCORE) && p1Score !== p2Score) {
                    gameState = 'GAME_OVER';
                    const winner = p1Score >= MAX_SCORE ? "PLAYER 1" : "PLAYER 2";
                    const winCol = p1Score >= MAX_SCORE ? P1_COLOR : P2_COLOR;
                    showCenterText(winner + " WINS!", winCol);
                    restartBtn.style.display = 'block';
                } else {
                    startRound();
                }
            }
        }

        updateMovers();
        players.forEach(p => p.update());
        checkSpikes();
        bullets.forEach(b => b.update());
        bullets = bullets.filter(b => !b.markedForDeletion);
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);

        // Shake decay
        if (screenShake > 0) screenShake *= 0.9;
        
        // Camera (Simple follow center)
        let targetCamX = 0;
        let targetCamY = 0;
        if (players.length === 2) {
            const centerX = (players[0].x + players[1].x) / 2;
            targetCamX = (400 - centerX) * 0.05;
        }
        camX += (targetCamX - camX) * 0.1;
    }

    function render() {
        ctx.fillStyle = '#1a1a24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        
        // Screen Shake & Camera
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(camX + shakeX, shakeY);

        // Grid Background
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 800; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 600);
            ctx.stroke();
        }
        for (let i = 0; i < 600; i += 40) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(800, i);
            ctx.stroke();
        }

        // Platforms
        platforms.forEach(p => {
            if (p.type === 'solid') {
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            } else {
                const gradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                gradient.addColorStop(0, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1, 'rgba(255,255,255,0.05)');
                ctx.fillStyle = gradient;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = p.move ? 'rgba(255,214,0,0.75)' : 'rgba(255,255,255,0.4)';
                ctx.fillRect(p.x, p.y, p.w, 2);
            }
        });

        // Spikes
        ctx.fillStyle = '#ff2d55';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff2d55';
        spikes.forEach(s => {
            const n = Math.max(1, Math.round(s.w / 14));
            const tw = s.w / n;
            for (let i = 0; i < n; i++) {
                ctx.beginPath();
                ctx.moveTo(s.x + i * tw, s.y + s.h);
                ctx.lineTo(s.x + (i + 0.5) * tw, s.y);
                ctx.lineTo(s.x + (i + 1) * tw, s.y + s.h);
                ctx.closePath();
                ctx.fill();
            }
        });
        ctx.shadowBlur = 0;

        particles.forEach(p => p.draw(ctx));
        bullets.forEach(b => b.draw(ctx));
        players.forEach(p => p.draw(ctx));

        ctx.restore();
    }

    initGame();
    gameLoop();

</script>
</body>
