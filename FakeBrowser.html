<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim - Premium Browser Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chrome: {
                            bg: '#0f172a',
                            toolbar: '#1e293b',
                            tabInactive: '#0f172a',
                            tabActive: '#1e293b',
                            address: '#334155',
                            border: '#334155'
                        },
                        gurgle: {
                            blue: '#4285F4',
                            red: '#EA4335',
                            yellow: '#FBBC05',
                            green: '#34A853'
                        },
                        fb: {
                            blue: '#1877F2',
                            bg: '#f0f2f5'
                        },
                        zoon: {
                            red: '#FF0000',
                            bg: '#0f0f0f'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        #browser-container {
            width: 95vw;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .browser-chrome {
            background: #1e293b;
            padding-top: 8px;
            user-select: none;
        }

        .tab-bar {
            display: flex;
            padding: 0 12px;
            gap: 4px;
            align-items: flex-end;
        }

        .tab {
            height: 36px;
            min-width: 140px;
            max-width: 200px;
            padding: 0 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab.active {
            background: #ffffff;
            color: #1e293b;
            font-weight: 500;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: background 0.2s;
        }

        .tab-close:hover {
            background: rgba(0,0,0,0.1);
        }

        .toolbar {
            height: 48px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .nav-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .address-bar {
            flex-grow: 1;
            height: 34px;
            background: #f1f5f9;
            border-radius: 17px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            color: #475569;
            font-size: 14px;
            border: 1px solid transparent;
        }

        .viewport {
            flex-grow: 1;
            overflow-y: auto;
            background: #f8fafc;
        }

        /* Simulated Sites CSS */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .gurgle-g { color: #4285F4; }
        .gurgle-u { color: #EA4335; }
        .gurgle-r { color: #FBBC05; }
        .gurgle-g2 { color: #4285F4; }
        .gurgle-l { color: #34A853; }
        .gurgle-e { color: #EA4335; }

        .clicker-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: 8px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 0 #1d4ed8, 0 20px 30px rgba(37, 99, 235, 0.4);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 24px;
            user-select: none;
        }

        .clicker-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #1d4ed8, 0 5px 15px rgba(37, 99, 235, 0.2);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="browser-container">
        <!-- Browser Chrome -->
        <div class="browser-chrome">
            <div id="tab-bar" class="tab-bar">
                <!-- Tabs generated by JS -->
                <button id="new-tab-btn" class="mb-1 ml-2 text-slate-400 hover:text-white transition-colors" title="New Tab">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            
            <div class="toolbar">
                <div id="back-btn" class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </div>
                <div id="forward-btn" class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
                <div id="refresh-btn" class="nav-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </div>
                <div class="address-bar">
                    <svg class="text-green-500" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"></path></svg>
                    <span id="address-text" class="truncate">about:home</span>
                </div>
                <div class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </div>
            </div>
        </div>

        <!-- Content Viewport -->
        <div id="viewport" class="viewport">
            <!-- Simulated Content Rendered Here -->
        </div>
    </div>

    <script>
        const state = {
            tabs: [],
            activeTabId: null,
            tabCounter: 0,
            clickerScore: 0,
            clickerPower: 1,
            likedPosts: new Set()
        };

        const sites = {
            'home': {
                title: 'New Tab',
                url: 'about:home',
                render: () => `
                    <div class="p-12 max-w-4xl mx-auto">
                        <div class="text-center mb-16">
                            <h1 class="text-6xl font-black font-display text-slate-800 mb-2">WebSim</h1>
                            <p class="text-slate-500 text-lg">Your gateway to the simulated internet</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
                            ${renderShortcut('Gurgle', 'gurgle.com', 'bg-blue-500', 'G')}
                            ${renderShortcut('FriendBook', 'friendbook.com', 'bg-blue-600', 'f')}
                            ${renderShortcut('Zoon', 'zoon.tv', 'bg-red-600', 'Z')}
                            ${renderShortcut('Clicker Tycoon', 'clicker.io', 'bg-orange-500', 'C')}
                        </div>
                    </div>
                `
            },
            'gurgle.com': {
                title: 'Gurgle Search',
                url: 'gurgle.com',
                render: (sub) => {
                    if (sub === '/news') return renderGurgleNews();
                    return `
                        <div class="flex flex-col items-center pt-24 h-full bg-white">
                            <div class="text-6xl font-bold font-sans mb-8">
                                <span class="gurgle-g">G</span><span class="gurgle-u">u</span><span class="gurgle-r">r</span><span class="gurgle-g2">g</span><span class="gurgle-l">l</span><span class="gurgle-e">e</span>
                            </div>
                            <div class="w-full max-w-xl px-4">
                                <div class="relative">
                                    <input type="text" placeholder="Search the simulation..." class="w-full h-12 px-12 rounded-full border border-slate-200 focus:outline-none focus:shadow-md transition-shadow">
                                    <svg class="absolute left-4 top-3.5 text-slate-400" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </div>
                                <div class="flex justify-center gap-4 mt-8">
                                    <button class="px-6 py-2 bg-slate-50 text-slate-700 rounded text-sm font-medium hover:ring-1 ring-slate-200">Gurgle Search</button>
                                    <button class="px-6 py-2 bg-slate-50 text-slate-700 rounded text-sm font-medium hover:ring-1 ring-slate-200">I'm Feeling Curious</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            },
            'friendbook.com': {
                title: 'FriendBook',
                url: 'friendbook.com',
                render: () => `
                    <div class="bg-fb-bg min-h-full">
                        <nav class="bg-fb-blue text-white h-14 flex items-center px-4 sticky top-0 z-10 shadow-sm">
                            <span class="text-2xl font-black font-sans tracking-tight">friendbook</span>
                            <div class="ml-8 bg-blue-700/50 rounded-full px-4 py-1.5 flex items-center flex-grow max-w-sm">
                                <svg class="text-blue-200 mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <span class="text-blue-100 text-sm">Search FriendBook</span>
                            </div>
                        </nav>
                        <div class="max-w-xl mx-auto py-6 px-4">
                            ${renderPost(1, 'Simulated Sarah', 'Just discovered this incredible simulated browser! The pixels are so realistic. 💻', '5 mins ago')}
                            ${renderPost(2, 'Tech Tim', 'Does anyone know how to increase CPU cycles in a web-based VM? Asking for a friend...', '1 hour ago')}
                            ${renderPost(3, 'AI Developer', 'I think, therefore I render.', '3 hours ago')}
                        </div>
                    </div>
                `
            },
            'zoon.tv': {
                title: 'Zoon',
                url: 'zoon.tv',
                render: (videoId) => `
                    <div class="bg-zoon-bg min-h-full text-white">
                        <nav class="h-14 flex items-center px-6 bg-zoon-bg border-b border-white/10">
                            <div class="flex items-center gap-1">
                                <div class="bg-red-600 px-1.5 py-0.5 rounded-lg">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                                </div>
                                <span class="text-xl font-bold tracking-tighter">Zoon</span>
                            </div>
                        </nav>
                        <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
                            <div class="lg:col-span-2">
                                <div class="aspect-video bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-white/5">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                                    <button class="w-20 h-20 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center transition-all z-10 group">
                                        <svg class="text-white fill-current group-hover:scale-110 transition-transform" width="40" height="40" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    </button>
                                </div>
                                <h1 class="text-2xl font-bold mt-4">${videoId ? 'Watching: ' + videoId : 'WebSim: The Movie (Official Trailer)'}</h1>
                                <div class="flex items-center justify-between mt-2 py-4 border-b border-white/10">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500"></div>
                                        <div>
                                            <p class="font-bold">Creative Simulator</p>
                                            <p class="text-xs text-zinc-400">1.2M subscribers</p>
                                        </div>
                                        <button class="ml-4 px-4 py-2 bg-white text-black rounded-full text-sm font-bold">Subscribe</button>
                                    </div>
                                    <div class="flex gap-2">
                                        <div class="bg-white/10 px-4 py-2 rounded-full text-sm font-medium">15k 👍</div>
                                        <div class="bg-white/10 px-4 py-2 rounded-full text-sm font-medium">Share</div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-4">
                                <h3 class="text-lg font-bold">Up Next</h3>
                                ${renderZoonVideo('The Future of AI Browsing', 'AI Labs', '450k views')}
                                ${renderZoonVideo('Clicker Tycoon Speedrun', 'GamingGamer', '1.2M views')}
                                ${renderZoonVideo('React vs Vue in 2024', 'DevLife', '89k views')}
                            </div>
                        </div>
                    </div>
                `
            },
            'clicker.io': {
                title: 'Clicker Tycoon',
                url: 'clicker.io',
                render: () => `
                    <div class="flex flex-col items-center justify-center min-h-full bg-slate-900 text-white p-8">
                        <h1 class="text-5xl font-black font-display mb-2 text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">CLICKER TYCOON</h1>
                        <p class="text-slate-400 mb-12">The world's most productive simulation</p>
                        
                        <div class="flex flex-col items-center gap-8">
                            <div class="text-center">
                                <div class="text-sm uppercase tracking-widest text-slate-500 font-bold mb-1">Total Power</div>
                                <div class="text-6xl font-black font-display text-white">${state.clickerScore.toLocaleString()}</div>
                            </div>

                            <button onclick="handleBigClick()" class="clicker-btn">CLICK!</button>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8 w-full max-w-lg">
                                ${renderUpgrade(10, 1, 'Auto-Clicker')}
                                ${renderUpgrade(50, 5, 'Super Finger')}
                                ${renderUpgrade(200, 25, 'Mouse Farm')}
                                ${renderUpgrade(1000, 150, 'Quantum Click')}
                            </div>
                        </div>
                    </div>
                `
            }
        };

        function renderShortcut(name, url, color, initial) {
            return `
                <div onclick="navigateTo('${url}')" class="group flex flex-col items-center cursor-pointer">
                    <div class="w-16 h-16 ${color} rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg group-hover:scale-110 transition-transform duration-200 mb-3">
                        ${initial}
                    </div>
                    <span class="text-sm font-semibold text-slate-600 group-hover:text-slate-900">${name}</span>
                </div>
            `;
        }

        function renderPost(id, author, content, time) {
            const liked = state.likedPosts.has(id);
            return `
                <div class="bg-white rounded-lg shadow-sm mb-4 border border-slate-200 overflow-hidden">
                    <div class="p-4 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-slate-200"></div>
                        <div>
                            <p class="font-bold text-slate-900 leading-tight">${author}</p>
                            <p class="text-xs text-slate-500">${time}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-4 text-slate-800">
                        ${content}
                    </div>
                    <div class="border-t border-slate-100 flex p-1">
                        <button onclick="toggleLike(${id})" class="flex-1 py-2 flex items-center justify-center gap-2 hover:bg-slate-50 rounded font-semibold text-sm ${liked ? 'text-fb-blue' : 'text-slate-600'}">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                            ${liked ? 'Liked' : 'Like'}
                        </button>
                        <button class="flex-1 py-2 flex items-center justify-center gap-2 hover:bg-slate-50 rounded font-semibold text-sm text-slate-600">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            Comment
                        </button>
                    </div>
                </div>
            `;
        }

        function renderZoonVideo(title, channel, views) {
            return `
                <div class="flex gap-3 cursor-pointer group" onclick="navigateTo('zoon.tv?v=${encodeURIComponent(title)}')">
                    <div class="w-40 flex-shrink-0 aspect-video bg-zinc-800 rounded-lg overflow-hidden relative">
                        <div class="absolute bottom-1 right-1 bg-black/80 text-[10px] px-1 rounded">12:04</div>
                    </div>
                    <div class="flex flex-col">
                        <h4 class="text-sm font-bold leading-tight group-hover:text-zinc-300 line-clamp-2">${title}</h4>
                        <p class="text-xs text-zinc-400 mt-1">${channel}</p>
                        <p class="text-xs text-zinc-400">${views}</p>
                    </div>
                </div>
            `;
        }

        function renderUpgrade(cost, power, name) {
            const canAfford = state.clickerScore >= cost;
            return `
                <button 
                    onclick="buyUpgrade(${cost}, ${power})"
                    ${!canAfford ? 'disabled' : ''}
                    class="p-4 rounded-xl flex flex-col text-left transition-all ${canAfford ? 'bg-slate-800 hover:bg-slate-700 active:scale-95 cursor-pointer border border-slate-700' : 'bg-slate-900 border border-slate-800 opacity-50 cursor-not-allowed'}">
                    <span class="text-xs font-bold text-slate-500 uppercase">${name}</span>
                    <span class="text-lg font-bold text-white">+${power} Power</span>
                    <span class="text-sm ${canAfford ? 'text-orange-400' : 'text-slate-600'}">Cost: ${cost}</span>
                </button>
            `;
        }

        function init() {
            createNewTab();
            
            document.getElementById('new-tab-btn').addEventListener('click', createNewTab);
            document.getElementById('back-btn').addEventListener('click', goBack);
            document.getElementById('forward-btn').addEventListener('click', goForward);
            document.getElementById('refresh-btn').addEventListener('click', refreshTab);
        }

        function createNewTab() {
            const id = ++state.tabCounter;
            const newTab = {
                id,
                history: ['about:home'],
                currentIndex: 0,
                title: 'New Tab'
            };
            state.tabs.push(newTab);
            setActiveTab(id);
        }

        function closeTab(e, id) {
            e.stopPropagation();
            if (state.tabs.length === 1) return;
            
            const index = state.tabs.findIndex(t => t.id === id);
            const wasActive = state.activeTabId === id;
            
            state.tabs.splice(index, 1);
            if (wasActive) {
                state.activeTabId = state.tabs[Math.max(0, index - 1)].id;
            }
            renderTabs();
            renderViewport();
        }

        function setActiveTab(id) {
            state.activeTabId = id;
            renderTabs();
            renderViewport();
        }

        function navigateTo(url) {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            // Clean forward history if we are in middle of history
            tab.history = tab.history.slice(0, tab.currentIndex + 1);
            tab.history.push(url);
            tab.currentIndex++;
            renderViewport();
        }

        function goBack() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab.currentIndex > 0) {
                tab.currentIndex--;
                renderViewport();
            }
        }

        function goForward() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab.currentIndex < tab.history.length - 1) {
                tab.currentIndex++;
                renderViewport();
            }
        }

        function refreshTab() {
            renderViewport();
        }

        function renderTabs() {
            const tabBar = document.getElementById('tab-bar');
            const newBtn = document.getElementById('new-tab-btn');
            
            // Clear existing tabs
            const existingTabs = tabBar.querySelectorAll('.tab');
            existingTabs.forEach(t => t.remove());

            state.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === state.activeTabId ? 'active' : ''}`;
                tabEl.onclick = () => setActiveTab(tab.id);
                tabEl.innerHTML = `
                    <span class="truncate pr-4">${tab.title}</span>
                    <span class="tab-close" onclick="closeTab(event, ${tab.id})">✕</span>
                `;
                tabBar.insertBefore(tabEl, newBtn);
            });
        }

        function renderViewport() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            const url = tab.history[tab.currentIndex];
            const viewport = document.getElementById('viewport');
            
            // Update UI
            document.getElementById('address-text').textContent = url;
            document.getElementById('back-btn').className = `nav-btn ${tab.currentIndex === 0 ? 'disabled' : ''}`;
            document.getElementById('forward-btn').className = `nav-btn ${tab.currentIndex === tab.history.length - 1 ? 'disabled' : ''}`;

            // Logic to render site
            let siteKey = url;
            let sub = '';

            if (url.includes('?')) {
                const parts = url.split('?');
                siteKey = parts[0];
                sub = parts[1];
            } else if (url.includes('/')) {
                const parts = url.split('/');
                if (parts[1]) {
                    siteKey = parts[0];
                    sub = '/' + parts[1];
                }
            }

            if (url === 'about:home') {
                tab.title = 'New Tab';
                viewport.innerHTML = sites['home'].render();
            } else if (sites[siteKey]) {
                tab.title = sites[siteKey].title;
                viewport.innerHTML = sites[siteKey].render(sub);
            } else {
                tab.title = '404 Not Found';
                viewport.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500">
                        <svg class="mb-4" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h1 class="text-3xl font-bold mb-2">404 Web Not Simulated</h1>
                        <p>The URL you requested was not found in our database.</p>
                        <button onclick="navigateTo('about:home')" class="mt-6 px-6 py-2 bg-slate-800 text-white rounded-lg">Go Home</button>
                    </div>
                `;
            }
            
            renderTabs();
        }

        // Global Game Helpers
        window.toggleLike = (id) => {
            if (state.likedPosts.has(id)) {
                state.likedPosts.delete(id);
            } else {
                state.likedPosts.add(id);
            }
            renderViewport();
        };

        window.handleBigClick = () => {
            state.clickerScore += state.clickerPower;
            renderViewport();
        };

        window.buyUpgrade = (cost, power) => {
            if (state.clickerScore >= cost) {
                state.clickerScore -= cost;
                state.clickerPower += power;
                renderViewport();
            }
        };

        window.navigateTo = navigateTo;

        init();
    </script>
</body>
</html>
