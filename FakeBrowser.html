        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        #browser-container {
            width: 95vw;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .browser-chrome {
            background: #1e293b;
            padding-top: 8px;
            user-select: none;
        }

        .tab-bar {
            display: flex;
            padding: 0 12px;
            gap: 4px;
            align-items: flex-end;
        }

        .tab {
            height: 36px;
            min-width: 140px;
            max-width: 200px;
            padding: 0 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab.active {
            background: #ffffff;
            color: #1e293b;
            font-weight: 500;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: background 0.2s;
        }

        .tab-close:hover {
            background: rgba(0,0,0,0.1);
        }

        .toolbar {
            height: 48px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .nav-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .address-bar {
            flex-grow: 1;
            height: 34px;
            background: #f1f5f9;
            border-radius: 17px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            color: #475569;
            font-size: 14px;
            border: 1px solid transparent;
        }

        .viewport {
            flex-grow: 1;
            overflow-y: auto;
            background: #f8fafc;
        }

        /* Simulated Sites CSS */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .gurgle-g { color: #4285F4; }
        .gurgle-u { color: #EA4335; }
        .gurgle-r { color: #FBBC05; }
        .gurgle-g2 { color: #4285F4; }
        .gurgle-l { color: #34A853; }
        .gurgle-e { color: #EA4335; }

        .clicker-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: 8px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 0 #1d4ed8, 0 20px 30px rgba(37, 99, 235, 0.4);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 24px;
            user-select: none;
        }

        .clicker-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #1d4ed8, 0 5px 15px rgba(37, 99, 235, 0.2);
        }


        .address-bar:focus-within { background: #ffffff; border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(147,197,253,0.4); }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

        // ---------- Zoon video scenes (procedural canvas animations, one per video) ----------
        const CW = 960, CH = 540;
        const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

            c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);

        // 1. WebSim: The Movie (Official Trailer)

            const per = 4, lt = t % (cards.length * per), idx = Math.floor(lt / per), p = (lt % per) / per;
            const a = Math.max(0, Math.min(1, p * 4, (1 - p) * 4));

        // 2. The Future of AI Browsing
        function sceneAI(c, t) {
            const g = c.createLinearGradient(0, 0, 0, CH);

        // 3. Clicker Tycoon Speedrun

            txt(c, 'CLICK!', 480, cy + press * 11, 34, '#ffffff');
            for (let j = clicks; j > clicks - 10 && j > 0; j--) {

                txt(c, '+' + power, 480 + (rnd(j) - 0.5) * 320, 290 - age * 170, 30, '#fdba74');

        // 6. I Built a Browser Inside a Browser (infinite zoom)
        function sceneNested(c, t) {

                c.fillStyle = '#1e293b'; c.fillRect(0, 0, W, H * 0.1);
                c.fillStyle = '#f1f5f9'; rr(c, W * 0.02, H * 0.03, W * 0.18, H * 0.08, H * 0.02); c.fill();
                c.fillStyle = '#f1f5f9'; c.fillRect(0, H * 0.1, W, H * 0.12);
                c.fillStyle = '#cbd5e1'; rr(c, W * 0.14, H * 0.12, W * 0.72, H * 0.08, H * 0.04); c.fill();
                ['#f87171', '#fbbf24', '#4ade80'].forEach((col, i) => {
                    c.fillStyle = col; c.beginPath(); c.arc(W * (0.03 + i * 0.03), H * 0.16, H * 0.014, 0, 7); c.fill();
                });
                c.fillStyle = `hsl(${((k + shift) * 47) % 360},70%,55%)`; c.fillRect(0, H * 0.22, W, H * 0.78);
                c.translate(W * 0.1, H * 0.22); c.scale(0.8, 0.72);
            }
            c.restore();
            c.fillStyle = 'rgba(0,0,0,0.6)'; rr(c, 330, 478, 300, 40, 20); c.fill();
            txt(c, 'BROWSER #' + (shift + 1) + ' OF ∞', 480, 498, 20, '#ffffff', 'center', 700);
        }

        // 7. Cat vs Cucumber (Compilation)
        function drawCat(c, x, y, scared, t) {
            c.save(); c.translate(x, y);
            c.strokeStyle = '#f59e0b'; c.lineWidth = 16; c.lineCap = 'round';
            c.beginPath(); c.moveTo(-60, -10);
            c.quadraticCurveTo(-125, -30 - Math.sin(t * (scared ? 20 : 3)) * 20, -105, -105 + Math.sin(t * (scared ? 20 : 3)) * 12);
            c.stroke();
            c.fillStyle = '#f59e0b';
            c.beginPath(); c.ellipse(0, 0, 75, 46, 0, 0, 7); c.fill();
            rr(c, -50, 20, 22, 36, 8); c.fill(); rr(c, 28, 20, 22, 36, 8); c.fill();
            c.strokeStyle = '#d97706'; c.lineWidth = 6;
            for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 22, -44); c.lineTo(i * 22 + 5, -22); c.stroke(); }
            c.fillStyle = '#f59e0b'; c.beginPath(); c.arc(70, -38, 36, 0, 7); c.fill();
            c.beginPath(); c.moveTo(45, -62); c.lineTo(52, -102); c.lineTo(78, -70); c.fill();
            c.beginPath(); c.moveTo(82, -70); c.lineTo(100, -100); c.lineTo(104, -60); c.fill();
            c.fillStyle = '#fda4af'; c.beginPath(); c.moveTo(54, -70); c.lineTo(54, -90); c.lineTo(68, -72); c.fill();
            if (scared) {
                const sh = Math.sin(t * 40) * 1.5;
                c.fillStyle = '#fff'; c.beginPath(); c.arc(58, -44, 11, 0, 7); c.arc(86, -44, 11, 0, 7); c.fill();
                c.fillStyle = '#111'; c.beginPath(); c.arc(60 + sh, -44, 4, 0, 7); c.arc(88 + sh, -44, 4, 0, 7); c.fill();
                c.beginPath(); c.ellipse(76, -18, 6, 9, 0, 0, 7); c.fill();
            } else {
                c.fillStyle = '#111'; c.beginPath(); c.ellipse(60, -44, 6, 9, 0, 0, 7); c.ellipse(88, -44, 6, 9, 0, 0, 7); c.fill();
                c.fillStyle = '#fff'; c.beginPath(); c.arc(62, -47, 2, 0, 7); c.arc(90, -47, 2, 0, 7); c.fill();
                c.strokeStyle = '#111'; c.lineWidth = 2.5; c.beginPath(); c.arc(76, -26, 6, 0.2, Math.PI - 0.2); c.stroke();
            }
            c.fillStyle = '#f472b6'; c.beginPath(); c.moveTo(70, -34); c.lineTo(82, -34); c.lineTo(76, -27); c.fill();
            c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.5;
            for (const d of [-6, 4]) { c.beginPath(); c.moveTo(96, -28 + d); c.lineTo(125, -32 + d * 2); c.stroke(); c.beginPath(); c.moveTo(56, -28 + d); c.lineTo(30, -32 + d * 2); c.stroke(); }
            c.restore();
        }

        function sceneCat(c, t) {
            const lt = t % 7;
            c.fillStyle = '#fde7c8'; c.fillRect(0, 0, CW, CH);
            c.fillStyle = 'rgba(255,255,255,0.25)';
            for (let i = 0; i < 12; i++) c.fillRect(i * 80, 0, 40, 400);
            c.fillStyle = '#b9824f'; c.fillRect(0, 400, CW, 140);
            c.fillStyle = 'rgba(0,0,0,0.12)';
            for (let i = 0; i < 8; i++) c.fillRect(0, 400 + i * 20, CW, 2);
            const cx = lt < 2.4 ? 1100 - (lt / 2.4) * 520 : 580;
            c.fillStyle = '#4ade80'; rr(c, cx - 85, 366, 170, 44, 22); c.fill();
            c.fillStyle = '#16a34a';
            for (let i = 0; i < 6; i++) c.fillRect(cx - 55 + i * 26, 368, 5, 40);
            c.fillStyle = 'rgba(255,255,255,0.35)'; rr(c, cx - 70, 372, 120, 6, 3); c.fill();
            c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - 58, 384, 8, 0, 7); c.arc(cx - 36, 384, 8, 0, 7); c.fill();
            c.fillStyle = '#111'; c.beginPath(); c.arc(cx - 61, 385, 3.5, 0, 7); c.arc(cx - 39, 385, 3.5, 0, 7); c.fill();
            c.strokeStyle = '#14532d'; c.lineWidth = 3;
            c.beginPath(); c.moveTo(cx - 68, 372); c.lineTo(cx - 50, 377); c.moveTo(cx - 46, 377); c.lineTo(cx - 28, 372); c.stroke();
            if (lt < 4.5) {
                const x = lt < 3.4 ? 230 : 230 - (lt - 3.4) * 420;
                const jump = lt > 2.6 && lt < 3.4 ? 170 * Math.sin((lt - 2.6) / 0.8 * Math.PI) : 0;
                drawCat(c, x, 345 - jump, lt >= 2.2, t);
                if (lt > 2.2 && lt < 3.2) txt(c, '!', x + 70, 190 - jump, 90, '#ef4444');
            }
            if (lt > 4.8) {
                c.globalAlpha = Math.min(1, (lt - 4.8) * 2);
                txt(c, 'THE CUCUMBER WINS', 480, 130, 56, '#14532d');
                c.globalAlpha = 1;
            }
            const fade = lt < 0.3 ? 1 - lt / 0.3 : lt > 6.7 ? (lt - 6.7) / 0.3 : 0;
            if (fade > 0) { c.fillStyle = `rgba(0,0,0,${fade})`; c.fillRect(0, 0, CW, CH); }
        }

        const SCENES = {};
        [sceneTrailer, sceneAI, sceneClicker, sceneVersus, sceneLofi, sceneNested, sceneCat]
            .forEach((fn, i) => { SCENES[VIDEOS[i].t] = fn; });
        const THUMB_T = [14, 5, 6, 3, 4, 2, 3.3];

        function drawFrame(cv, v, t) {
            const c = cv.getContext && cv.getContext('2d');
            if (!c) return;
            try {
                c.setTransform(cv.width / CW, 0, 0, cv.height / CH, 0, 0);
                (SCENES[v.t] || sceneTrailer)(c, t);
            } catch (err) { console.error('Zoon scene error:', err); }
        }

        function drawThumbs() {
            document.querySelectorAll('canvas[data-thumb]').forEach(cv => {
                const i = Number(cv.dataset.thumb);
                drawFrame(cv, VIDEOS[i], THUMB_T[i] || 3);
            });
        }

        function drawMain() {
            const cv = document.getElementById('z-canvas');
            if (!cv) return false;
            drawFrame(cv, getVideo(state.zoon.video), state.zoon.time);
            return true;
        }

        function stopTick() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

        function updateZoonBar() {
            const bar = document.getElementById('z-bar'), label = document.getElementById('z-time');
            if (!bar || !label) { stopTick(); return; }
            const v = getVideo(state.zoon.video), secs = parseDur(v.dur);
            bar.style.width = Math.min(100, (state.zoon.time / secs) * 100) + '%';
            label.textContent = fmtTime(state.zoon.time) + ' / ' + v.dur;
        }

        function zoonAfter() {
            stopTick();
            drawThumbs();
            drawMain();
            if (!state.zoon.playing) return;
            lastTs = performance.now();
            const loop = (ts) => {
                const z = state.zoon, secs = parseDur(getVideo(z.video).dur);
                const dt = Math.min(0.1, Math.max(0, (ts - lastTs) / 1000));
                lastTs = ts;
                z.time = Math.min(secs, z.time + dt);
                if (!drawMain()) { stopTick(); return; }
                updateZoonBar();
                if (z.time >= secs) { z.playing = false; stopTick(); renderViewport(true); return; }
                rafId = requestAnimationFrame(loop);
            };
            rafId = requestAnimationFrame(loop);
        }

        // ---------- Browser core ----------
        function init() {
            createNewTab();

            document.getElementById('new-tab-btn').addEventListener('click', createNewTab);
            document.getElementById('back-btn').addEventListener('click', goBack);
            document.getElementById('forward-btn').addEventListener('click', goForward);
            document.getElementById('refresh-btn').addEventListener('click', refreshTab);

            const addr = document.getElementById('address-input');
            addr.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const url = normalizeUrl(addr.value);
                    addr.blur();
                    if (url) navigateTo(url);
                } else if (e.key === 'Escape') {
                    addr.value = currentUrl();
                    addr.blur();
                }
            });
            addr.addEventListener('focus', () => addr.select());

            const viewport = document.getElementById('viewport');
            viewport.addEventListener('click', (e) => {
                const g = e.target.closest('[data-go]');
                if (g) navigateTo(g.dataset.go);
            });
            viewport.addEventListener('mousedown', (e) => {
                const s = e.target.closest('[data-search]');
                if (s) { e.preventDefault(); gurgleSearch(s.dataset.search); }
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
                    e.preventDefault();
                    addr.focus();
                }
            });
        }

        function activeTab() { return state.tabs.find(t => t.id === state.activeTabId); }
        function currentUrl() { const t = activeTab(); return t.history[t.currentIndex]; }

        function createNewTab() {
            const id = ++state.tabCounter;
            state.tabs.push({ id, history: ['about:home'], currentIndex: 0, title: 'New Tab' });
            setActiveTab(id);
        }

        function closeTab(e, id) {
            e.stopPropagation();
            if (state.tabs.length === 1) return;

            const index = state.tabs.findIndex(t => t.id === id);
            const wasActive = state.activeTabId === id;

            state.tabs.splice(index, 1);
            if (wasActive) {
                state.activeTabId = state.tabs[Math.max(0, index - 1)].id;
            }
            renderTabs();
            renderViewport();
        }

        function setActiveTab(id) {
            state.activeTabId = id;
            renderTabs();
            renderViewport();
        }

        function navigateTo(url) {
            const tab = activeTab();
            if (url === tab.history[tab.currentIndex]) { renderViewport(); return; }
            tab.history = tab.history.slice(0, tab.currentIndex + 1);
            tab.history.push(url);
            tab.currentIndex++;
            renderViewport();
        }

        function goBack() {
            const tab = activeTab();
            if (tab.currentIndex > 0) { tab.currentIndex--; renderViewport(); }
        }

        function goForward() {
            const tab = activeTab();
            if (tab.currentIndex < tab.history.length - 1) { tab.currentIndex++; renderViewport(); }
        }

        function refreshTab() { renderViewport(); }

        function renderTabs() {
            const tabBar = document.getElementById('tab-bar');
            const newBtn = document.getElementById('new-tab-btn');

            tabBar.querySelectorAll('.tab').forEach(t => t.remove());

            state.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === state.activeTabId ? 'active' : ''}`;
                tabEl.onclick = () => setActiveTab(tab.id);
                tabEl.innerHTML = `
                    <span class="truncate pr-4">${esc(tab.title)}</span>
                    <span class="tab-close" onclick="closeTab(event, ${tab.id})">✕</span>
                `;
                tabBar.insertBefore(tabEl, newBtn);
            });
        }

        function renderViewport(keepScroll) {
            const tab = activeTab();
            const url = tab.history[tab.currentIndex];
            const viewport = document.getElementById('viewport');
            const scroll = viewport.scrollTop;
            stopTick();

            const addr = document.getElementById('address-input');
            if (document.activeElement !== addr) addr.value = url;
            document.getElementById('back-btn').className = `nav-btn ${tab.currentIndex === 0 ? 'disabled' : ''}`;
            document.getElementById('forward-btn').className = `nav-btn ${tab.currentIndex === tab.history.length - 1 ? 'disabled' : ''}`;

            let site = null, rest = '';
            if (url === 'about:home') {
                site = sites['home'];
            } else {
                const parts = splitUrl(url);
                rest = parts.rest;
                site = sites[parts.host] || null;
                if (parts.host !== 'zoon.tv') state.zoon.playing = false;
            }
            if (url === 'about:home') state.zoon.playing = false;

            if (site) {
                tab.title = site.titleFn ? site.titleFn(rest) : site.title;
                viewport.innerHTML = site.render(rest);
            } else {
                tab.title = '404 Not Found';
                viewport.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500">
                        <svg class="mb-4" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h1 class="text-3xl font-bold mb-2">404 Web Not Simulated</h1>
                        <p>The URL you requested was not found in our database.</p>
                        <button onclick="navigateTo('about:home')" class="mt-6 px-6 py-2 bg-slate-800 text-white rounded-lg">Go Home</button>
                    </div>
                `;
            }
            viewport.scrollTop = keepScroll ? scroll : 0;
            if (site && site.after) site.after();
            renderTabs();
        }

        function toast(msg) {
            const old = document.getElementById('toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.id = 'toast';
            el.textContent = msg;
            el.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-5 py-2.5 rounded-full shadow-xl z-50';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        // ---------- Actions ----------
        // Gurgle
        window.gurgleSearch = (value) => {
            const q = (value || '').trim();
            if (!q) return;
            state.searches = [q, ...state.searches.filter(s => s !== q)].slice(0, 5);
            navigateTo('gurgle.com?q=' + encodeURIComponent(q));
        };
        window.gurgleCurious = () => {
            const options = SITE_INDEX.filter(s => s.url !== 'about:home');
            navigateTo(options[Math.floor(Math.random() * options.length)].url);
        };
        window.gurgleSuggest = (input) => {
            const box = input.parentElement.querySelector('.sug-box');
            const v = input.value.trim().toLowerCase();
            if (!v) { box.classList.add('hidden'); return; }
            const pool = [...new Set([...state.searches, ...SUGGEST])]
                .filter(s => s.toLowerCase().includes(v) && s.toLowerCase() !== v).slice(0, 6);
            box.innerHTML = pool.map(s => `<div data-search="${esc(s)}" class="px-5 py-2 hover:bg-slate-100 cursor-pointer text-sm text-slate-700">${esc(s)}</div>`).join('');
            box.classList.toggle('hidden', !pool.length);
        };

        // FriendBook
        window.toggleLike = (id) => {
            state.likedPosts.has(id) ? state.likedPosts.delete(id) : state.likedPosts.add(id);
            renderViewport(true);
        };
        window.toggleComments = (id) => {
            state.openComments.has(id) ? state.openComments.delete(id) : state.openComments.add(id);
            renderViewport(true);
            const input = document.getElementById('fb-c-' + id);
            if (input) input.focus();
        };
        window.fbComment = (id) => {
            const input = document.getElementById('fb-c-' + id);
            const text = input && input.value.trim();
            if (!text) return;
            state.posts.find(p => p.id === id).comments.push({ a: 'You', t: text });
            renderViewport(true);
            const again = document.getElementById('fb-c-' + id);
            if (again) again.focus();
        };
        window.sharePost = (id) => {
            state.posts.find(p => p.id === id).shares++;
            renderViewport(true);
            toast('Post shared to your timeline');
        };
        window.fbPost = () => {
            const input = document.getElementById('fb-compose');
            const text = input && input.value.trim();
            if (!text) return;
            state.posts.unshift({ id: ++state.postCounter, author: 'You', content: text, time: 'Just now', likes: 0, shares: 0, comments: [] });
            renderViewport(true);
        };
        window.fbSearch = (value) => {
            const q = value.trim();
            navigateTo(q ? 'friendbook.com?q=' + encodeURIComponent(q) : 'friendbook.com');
        };

        // Zoon
        window.zoonToggle = () => {
            const z = state.zoon, secs = parseDur(getVideo(z.video).dur);
            if (z.time >= secs) z.time = 0;
            z.playing = !z.playing;
            renderViewport(true);
        };
        window.zoonSeek = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            state.zoon.time = frac * parseDur(getVideo(state.zoon.video).dur);
            updateZoonBar();
            drawMain();
        };
        window.zoonLike = () => {
            const l = state.zoon.liked, t = state.zoon.video;
            l.has(t) ? l.delete(t) : l.add(t);
            renderViewport(true);
        };
        window.zoonSub = (ch) => {
            const s = state.zoon.subs;
            s.has(ch) ? s.delete(ch) : s.add(ch);
            renderViewport(true);
        };
        window.zoonShare = () => toast('Link copied to clipboard');
        window.zoonComment = () => {
            const input = document.getElementById('z-comment');
            const text = input && input.value.trim();
            if (!text) return;
            const z = state.zoon;
            (z.comments[z.video] || (z.comments[z.video] = [])).push({ a: 'You', t: text });
            renderViewport(true);
        };
        window.zoonSearch = (value) => {
            const q = value.trim();
            navigateTo(q ? 'zoon.tv?q=' + encodeURIComponent(q) : 'zoon.tv');
        };

        // Clicker Tycoon
        window.handleBigClick = () => {
            state.clickerScore += state.clickerPower;
            renderViewport(true);
        };

        window.buyUpgrade = (cost, power) => {
            if (state.clickerScore >= cost) {
                state.clickerScore -= cost;
                state.clickerPower += power;
                renderViewport(true);
            }
        };

        window.navigateTo = navigateTo;
        window.closeTab = closeTab;

        init();
    </script>
</body>
</html>
